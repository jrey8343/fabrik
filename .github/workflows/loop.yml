# The Fabrik Loop, called from a Product repo's .github/workflows/fabrik.yml.
#
# This file is wiring only. Every decision comes from the Kit's code: the Loop
# rules core (src/loop/rules.ts), which the push job runs through src/main.ts,
# and the routing in src/kit/jobs.ts.
#
# Each AFK role is an agent job followed by the push job (ADR-0002):
# - The agent job holds `contents: read` and no GitHub write credential, no
#   `id-token: write`, and only the agent service account, which loads the
#   Claude token, or for Implement only the implement service account, which
#   also loads the repo's test secrets (ADR-0004). It passes its output out as
#   an artifact, the Implementer's commits as a git bundle.
# - The push job runs on a fresh VM, loads the Fabrik App key through the push
#   service account, mints an App token, and never checks out or runs Product
#   code. It checks out only Fabrik itself, at the exact commit the caller pinned.
# - The failure job runs instead of the push job when the agent job failed or
#   was cancelled (its timeout-minutes included). Like the push job it never
#   touches Product code; it posts the failure notice through src/main.ts.
name: Fabrik Loop

on:
  workflow_call:
    secrets:
      OP_AGENT_TOKEN:
        description: The Product repo's read-only 1Password agent service account, which reads the Fabrik vault (the Claude token).
        required: true
      OP_IMPLEMENT_TOKEN:
        description: The Product repo's read-only 1Password implement service account, which reads the Fabrik vault (the Claude token) and the repo's Fabrik Sandbox vault (its test secrets).
        required: true
      OP_PUSH_TOKEN:
        description: The Product repo's read-only 1Password push service account, which reads the Fabrik App vault.
        required: true

permissions: {}

jobs:
  kit:
    name: Kit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only to read this workflow's own commit from the job's OIDC token.
      id-token: write
      contents: read
      # To read the issue, or the pull request, for the Loop rules core's snapshot.
      issues: read
      pull-requests: read
    outputs:
      sha: ${{ steps.kit.outputs.sha }}
      route: ${{ steps.route.outputs.route }}
      triage-timeout-minutes: ${{ steps.route.outputs.triage-timeout-minutes }}
      design-timeout-minutes: ${{ steps.route.outputs.design-timeout-minutes }}
      implement-timeout-minutes: ${{ steps.route.outputs.implement-timeout-minutes }}
      review-timeout-minutes: ${{ steps.route.outputs.review-timeout-minutes }}
      dispatch-timeout-minutes: ${{ steps.route.outputs.dispatch-timeout-minutes }}
      # For a Review or a retry: the agent PR, and the Ticket its branch was cut for.
      # For a first Implement run: its Ticket, with no PR.
      pull-request: ${{ steps.route.outputs.pull-request }}
      ticket: ${{ steps.route.outputs.ticket }}
      # For a retry: the agent branch it builds on, which the Implement job checks out.
      branch: ${{ steps.route.outputs.branch }}
      # For a Request-changes run: the Operator's review, its input. It runs as a retry otherwise does.
      review: ${{ steps.route.outputs.review }}
      # The model and effort the plan chose for its agent run, a Step-up included.
      model: ${{ steps.route.outputs.model }}
      effort: ${{ steps.route.outputs.effort }}
    steps:
      # No expression context names the commit of a called workflow, so read
      # it from the OIDC token's job_workflow_sha claim.
      - name: Find the Kit's pinned commit
        id: kit
        run: |
          set -euo pipefail
          jwt="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r .value)"
          claims="$(node -e 'process.stdout.write(Buffer.from(process.argv[1].split(".")[1], "base64url").toString())' "$jwt")"
          ref="$(jq -r .job_workflow_ref <<<"$claims")"
          sha="$(jq -r .job_workflow_sha <<<"$claims")"
          case "$ref" in
            jrey8343/fabrik/.github/workflows/loop.yml@*) ;;
            *) echo "::error::Unexpected Kit workflow ref: $ref"; exit 1 ;;
          esac
          echo "Kit: $ref ($sha)"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ steps.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # Read as data only; nothing from the Product repo runs in this job. The
      # workflows folder holds the caller workflow, whose Fabrik pins are checked too.
      - name: Check out the Product's Kit config and caller workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          sparse-checkout: |
            .fabrik
            .github/workflows
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the Kit config and caller workflow, and route the event
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node kit/src/kit/jobs.ts product

  triage:
    name: Triage
    needs: kit
    if: needs.kit.outputs.route == 'triage'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.triage-timeout-minutes) }}
    concurrency:
      group: fabrik-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      # Read by the failure job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
    steps:
      - name: Check out the Product repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          persist-credentials: false

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the Kit (Sandcastle and the Claude Code CLI, pinned)
        working-directory: kit
        run: npm ci

      - name: Fetch the pinned skills into .claude/skills
        run: node kit/src/skills/fetch.ts product

      # The agent gets the issue in its prompt, never a GitHub token.
      - name: Read the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json number,title,body,author,labels,comments >"$RUNNER_TEMP/issue.json"

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/Claude token/credential

      - name: Run Triage
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
        run: node ../kit/src/agent/run.ts triage

      - name: Pass the Triage output to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/fabrik-out/agent-result.json
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure. A run cancelled
      # by its timeout leaves none, and the failure job reads that as a timeout.
      - name: Pass the failure report to the failure job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

  triage-failed:
    name: Triage failed
    needs: [kit, triage]
    # always(), so this still runs when the Triage job was cancelled by its timeout.
    if: >-
      always() && needs.kit.result == 'success' && needs.kit.outputs.route == 'triage' &&
      (needs.triage.result == 'failure' || needs.triage.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: .fabrik-kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Take the agent job's failure report, if it left one
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/agent

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      - name: Post the failure notice
        working-directory: .fabrik-kit
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
          FABRIK_FAILED_ROLE: triage
          FABRIK_FAILED_ISSUE: ${{ github.event.issue.number }}
          FABRIK_AGENT_JOB_RESULT: ${{ needs.triage.result }}
          FABRIK_SECRETS_STEP: ${{ needs.triage.outputs.secrets-step }}
          FABRIK_AGENT_FAILURE: ${{ runner.temp }}/agent/agent-failure.json
        run: node src/main.ts

  design:
    name: Design-session turn
    needs: kit
    if: needs.kit.outputs.route == 'design'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.design-timeout-minutes) }}
    # One turn per issue at a time. queue: max keeps every queued Operator reply
    # instead of letting a newer one cancel the one already waiting.
    concurrency:
      group: fabrik-design-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
    outputs:
      # Read by the failure job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
    steps:
      - name: Check out the Product repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          persist-credentials: false

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the Kit (Sandcastle and the Claude Code CLI, pinned)
        working-directory: kit
        run: npm ci

      - name: Fetch the pinned skills into .claude/skills
        run: node kit/src/skills/fetch.ts product

      # Each turn rebuilds its context from the issue thread, and a Ticket's from its
      # parent Spec too, so a Ticket sent back to design is split under it; the agent
      # never gets a GitHub token.
      - name: Read the issue thread and its parent Spec
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json number,title,body,author,labels,comments >"$RUNNER_TEMP/issue.json"
          gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { issue(number: $number) { parent { number title body } } } }' \
            -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$ISSUE" \
            --jq '.data.repository.issue.parent' >"$RUNNER_TEMP/spec.json"
          # No parent prints nothing; the Design session reads that as no Spec.
          [ -s "$RUNNER_TEMP/spec.json" ] || echo null >"$RUNNER_TEMP/spec.json"

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/Claude token/credential

      - name: Run the Design-session turn
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_SPEC_FILE: ${{ runner.temp }}/spec.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
        run: node ../kit/src/agent/run.ts design

      - name: Pass the turn's output to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/fabrik-out/agent-result.json
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure. A run cancelled
      # by its timeout leaves none, and the failure job reads that as a timeout.
      - name: Pass the failure report to the failure job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

  design-failed:
    name: Design-session turn failed
    needs: [kit, design]
    # always(), so this still runs when the Design-session job was cancelled by its timeout.
    if: >-
      always() && needs.kit.result == 'success' && needs.kit.outputs.route == 'design' &&
      (needs.design.result == 'failure' || needs.design.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: .fabrik-kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Take the agent job's failure report, if it left one
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/agent

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      - name: Post the failure notice
        working-directory: .fabrik-kit
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
          FABRIK_FAILED_ROLE: design
          FABRIK_FAILED_ISSUE: ${{ github.event.issue.number }}
          FABRIK_AGENT_JOB_RESULT: ${{ needs.design.result }}
          FABRIK_SECRETS_STEP: ${{ needs.design.outputs.secrets-step }}
          FABRIK_AGENT_FAILURE: ${{ runner.temp }}/agent/agent-failure.json
        run: node src/main.ts

  # Takes agent:implement off the Ticket as its Implement run starts, so the
  # label never claims work that isn't running (the open draft PR does that).
  # It applies the same plan the Kit job routed on; the run itself is the
  # Implement job's. Like a push job, it never touches Product code.
  implement-claim:
    name: Claim the Ticket
    needs: kit
    if: needs.kit.outputs.route == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: .fabrik-kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      - name: Take agent:implement off the Ticket
        working-directory: .fabrik-kit
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: node src/main.ts

  # The Implementer (ADR-0002, ADR-0004). It holds only the implement service
  # account: the Claude token and this repo's test secrets, which Kit config
  # declares as op:// references, so none of them is named in this file. They
  # are resolved in output mode and reach the Implement step's env only.
  # Named "Implement" exactly: Dispatch counts jobs by this name (IMPLEMENT_JOB_NAME in src/github/snapshot.ts).
  implement:
    name: Implement
    needs: kit
    if: needs.kit.outputs.route == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.implement-timeout-minutes) }}
    # One Implement run per Ticket at a time, so two never race on one branch.
    # A retry starts from a PR event, so the Ticket comes from the Kit job.
    concurrency:
      group: fabrik-implement-${{ needs.kit.outputs.ticket }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      # A retry reads its PR's Verdict comments.
      pull-requests: read
    outputs:
      # Read by the failure job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
    steps:
      # A fresh clone: no working directory or .env* files carried over. A first
      # run starts from main; a retry from its PR's branch (the Kit job names it).
      - name: Check out the Product repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          ref: ${{ needs.kit.outputs.branch || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the Kit (Sandcastle and the Claude Code CLI, pinned)
        working-directory: kit
        run: npm ci

      - name: Fetch the pinned skills into .claude/skills
        run: node kit/src/skills/fetch.ts product

      # The agent gets the Ticket and its Spec in its prompt, never a GitHub token.
      - name: Read the Ticket and its parent Spec
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.kit.outputs.ticket }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json number,title,body,author,labels,comments >"$RUNNER_TEMP/issue.json"
          gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { issue(number: $number) { parent { number title body } } } }' \
            -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$ISSUE" \
            --jq '.data.repository.issue.parent' >"$RUNNER_TEMP/spec.json"
          # No parent prints nothing; the Implementer reads that as no Spec.
          [ -s "$RUNNER_TEMP/spec.json" ] || echo null >"$RUNNER_TEMP/spec.json"

      # A retry's findings: the PR's comments, with their authors' kind, so only the Fabrik App's Verdicts count.
      - name: Read the PR a retry fixes
        if: needs.kit.outputs.pull-request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ needs.kit.outputs.pull-request }}
        run: |
          set -euo pipefail
          gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { number title comments(last: 100) { nodes { body author { __typename } } } } } }' \
            -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$PULL_REQUEST" \
            --jq '.data.repository.pullRequest | {number, title, comments: .comments.nodes}' >"$RUNNER_TEMP/pull-request.json"

      # A Request-changes run's input: the review the Kit job's plan named, which it checked is the Operator's.
      - name: Read the Operator's requested changes
        if: needs.kit.outputs.review != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ needs.kit.outputs.pull-request }}
          REVIEW: ${{ needs.kit.outputs.review }}
        run: |
          set -euo pipefail
          reviews="repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/reviews/$REVIEW"
          jq -n --argjson review "$(gh api "$reviews")" --argjson comments "$(gh api --paginate --slurp "$reviews/comments" | jq 'add // []')" \
            '{review: $review, comments: $comments}' >"$RUNNER_TEMP/review.json"

      # Kit config is read as data; the list of op:// references goes to 1Password as a file.
      - name: List the test secrets to load
        run: node kit/src/kit/secrets-main.ts product "$RUNNER_TEMP/fabrik-secrets.env"

      - name: Load the Claude token and the test secrets
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_IMPLEMENT_TOKEN }}
          OP_ENV_FILE: ${{ runner.temp }}/fabrik-secrets.env
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/Claude token/credential

      - name: Run the Implementer
        working-directory: product
        env:
          # Every value the 1Password step resolved, in this step's env only.
          FABRIK_SECRETS: ${{ toJSON(steps.op.outputs) }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_SPEC_FILE: ${{ runner.temp }}/spec.json
          FABRIK_PULL_REQUEST_FILE: ${{ needs.kit.outputs.pull-request != '' && format('{0}/pull-request.json', runner.temp) || '' }}
          FABRIK_REVIEW_FILE: ${{ needs.kit.outputs.review != '' && format('{0}/review.json', runner.temp) || '' }}
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_MODEL: ${{ needs.kit.outputs.model }}
          FABRIK_EFFORT: ${{ needs.kit.outputs.effort }}
        run: node ../kit/src/agent/run.ts implement

      # The result and the bundle of the Implementer's commits (none if it made none).
      - name: Pass the Implementer's output and commits to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: |
            ${{ runner.temp }}/fabrik-out/agent-result.json
            ${{ runner.temp }}/fabrik-out/agent-branch.bundle
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure. A run cancelled
      # by its timeout leaves none, and the failure job reads that as a timeout.
      - name: Pass the failure report to the failure job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

  implement-failed:
    name: Implement failed
    needs: [kit, implement]
    # always(), so this still runs when the Implement job was cancelled by its timeout.
    if: >-
      always() && needs.kit.result == 'success' && needs.kit.outputs.route == 'implement' &&
      (needs.implement.result == 'failure' || needs.implement.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: .fabrik-kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Take the agent job's failure report, if it left one
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/agent

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      - name: Post the failure notice
        working-directory: .fabrik-kit
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
          FABRIK_FAILED_ROLE: implement
          # The Ticket, for a retry too: the core finds its PR and names agent:implement on the Ticket.
          FABRIK_FAILED_ISSUE: ${{ needs.kit.outputs.ticket }}
          FABRIK_AGENT_JOB_RESULT: ${{ needs.implement.result }}
          FABRIK_SECRETS_STEP: ${{ needs.implement.outputs.secrets-step }}
          FABRIK_AGENT_FAILURE: ${{ runner.temp }}/agent/agent-failure.json
        run: node src/main.ts

  # A Review starts by waiting for the agent PR's required checks on its head.
  # check_suite events don't fire for Actions CI, so it polls, bounded by the
  # Review timeout. It holds only a read-only token and no secrets, and reads
  # the Kit config as data. Red checks go straight to the push job as an
  # Execution flaw; the Reviewer never runs.
  review-checks:
    name: Review checks
    needs: kit
    if: needs.kit.outputs.route == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.review-timeout-minutes) }}
    concurrency:
      group: fabrik-review-checks-${{ needs.kit.outputs.pull-request }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      checks: ${{ steps.wait.outputs.checks }}
      head-sha: ${{ steps.wait.outputs.head-sha }}
      failed: ${{ steps.wait.outputs.failed }}
    steps:
      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # main's Kit config, read as data for its gating check list.
      - name: Check out the Product's Kit config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          sparse-checkout: .fabrik
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Wait for the required checks
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          FABRIK_PULL_REQUEST: ${{ needs.kit.outputs.pull-request }}
        run: node kit/src/review/wait.ts product

  # The Reviewer (ADR-0002). Read-only: a checkout of the PR's head at the
  # commit its checks passed on, no GitHub write credential, and only the
  # agent service account. It runs none of the PR's code, and passes its
  # Verdict out as an artifact for the push job to post.
  review:
    name: Review
    needs: [kit, review-checks]
    if: needs.kit.outputs.route == 'review' && needs.review-checks.outputs.checks == 'green'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.review-timeout-minutes) }}
    # One Review per PR at a time.
    concurrency:
      group: fabrik-review-${{ needs.kit.outputs.pull-request }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      # Read by the failure job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
    steps:
      - name: Check out the PR's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          ref: ${{ needs.review-checks.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the Kit (Sandcastle and the Claude Code CLI, pinned)
        working-directory: kit
        run: npm ci

      - name: Fetch the pinned skills into .claude/skills
        run: node kit/src/skills/fetch.ts product

      # The Reviewer gets the PR, its Ticket and Spec in its prompt, never a GitHub token.
      - name: Read the PR, its Ticket and the Ticket's Spec
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ needs.kit.outputs.pull-request }}
          TICKET: ${{ needs.kit.outputs.ticket }}
        run: |
          set -euo pipefail
          gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --json number,title,body,baseRefName,headRefName,headRefOid >"$RUNNER_TEMP/pull-request.json"
          gh issue view "$TICKET" --repo "$GITHUB_REPOSITORY" --json number,title,body,author,labels,comments >"$RUNNER_TEMP/issue.json"
          gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { issue(number: $number) { parent { number title body } } } }' \
            -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$TICKET" \
            --jq '.data.repository.issue.parent' >"$RUNNER_TEMP/spec.json"
          # No parent prints nothing; the Reviewer reads that as no Spec.
          [ -s "$RUNNER_TEMP/spec.json" ] || echo null >"$RUNNER_TEMP/spec.json"

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/Claude token/credential

      - name: Run the Reviewer
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_SPEC_FILE: ${{ runner.temp }}/spec.json
          FABRIK_PULL_REQUEST_FILE: ${{ runner.temp }}/pull-request.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_MODEL: ${{ needs.kit.outputs.model }}
          FABRIK_EFFORT: ${{ needs.kit.outputs.effort }}
        run: node ../kit/src/agent/run.ts review

      - name: Pass the Verdict to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/fabrik-out/agent-result.json
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure, a reply with no
      # valid Verdict line included. A run cancelled by its timeout leaves none.
      - name: Pass the failure report to the failure job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

  # A Review that failed or timed out, waiting on checks or in the Reviewer,
  # is an Infrastructure failure, never a pass. The notice goes on the PR and
  # names agent:review to re-add.
  review-failed:
    name: Review failed
    needs: [kit, review-checks, review]
    if: >-
      always() && needs.kit.result == 'success' && needs.kit.outputs.route == 'review' && (
        needs.review-checks.result == 'failure' || needs.review-checks.result == 'cancelled' ||
        needs.review.result == 'failure' || needs.review.result == 'cancelled'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: .fabrik-kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Take the agent job's failure report, if it left one
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/agent

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      - name: Post the failure notice
        working-directory: .fabrik-kit
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
          FABRIK_FAILED_ROLE: review
          # The Ticket: the notice lands on its open PR, where agent:review goes.
          FABRIK_FAILED_ISSUE: ${{ needs.kit.outputs.ticket }}
          FABRIK_AGENT_JOB_RESULT: ${{ needs.review-checks.result != 'success' && needs.review-checks.result || needs.review.result }}
          FABRIK_SECRETS_STEP: ${{ needs.review.outputs.secrets-step }}
          FABRIK_AGENT_FAILURE: ${{ runner.temp }}/agent/agent-failure.json
        run: node src/main.ts

  push:
    name: Push
    needs: [kit, triage, design, implement, review-checks, review]
    # Runs straight after the Kit job when it routed here, or after the agent job it routed to succeeded.
    # For an Implement run it runs the trust-root guard on the branch before pushing it (src/loop/implement.ts).
    # For a Review it posts the Verdict: red checks' straight from the checks job, else the Reviewer's.
    if: >-
      !cancelled() && needs.kit.result == 'success' && (
        needs.kit.outputs.route == 'push' ||
        (needs.kit.outputs.route == 'triage' && needs.triage.result == 'success') ||
        (needs.kit.outputs.route == 'design' && needs.design.result == 'success') ||
        (needs.kit.outputs.route == 'implement' && needs.implement.result == 'success') ||
        (needs.kit.outputs.route == 'review' && needs.review-checks.result == 'success' && (
          needs.review-checks.outputs.checks == 'red' ||
          (needs.review-checks.outputs.checks == 'green' && needs.review.result == 'success')
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      # "true" when the plan asked for a Dispatch check.
      dispatch: ${{ steps.loop.outputs.dispatch }}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: .fabrik-kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Red checks leave no agent output: the Reviewer didn't run.
      - name: Take the agent job's output
        if: needs.kit.outputs.route != 'push' && !(needs.kit.outputs.route == 'review' && needs.review-checks.outputs.checks == 'red')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/agent

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      # The App token, not GITHUB_TOKEN, so the labels it adds, the branch it
      # pushes and the PR it opens start later workflows, CI included.
      - name: Run the Loop
        id: loop
        working-directory: .fabrik-kit
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
          # The agent could rewrite its own artifact, so the run's issue comes from the event,
          # or for an Implement run (a retry's PR event included) from the Kit job's plan.
          FABRIK_RUN_ISSUE: ${{ needs.kit.outputs.route == 'implement' && needs.kit.outputs.ticket || github.event.issue.number }}
          # A retry's PR, from the Kit job's plan: its branch lands on that PR.
          FABRIK_RUN_PULL_REQUEST: ${{ needs.kit.outputs.route == 'implement' && needs.kit.outputs.pull-request || '' }}
          # Set for a Request-changes run, whose push is marked so its Verdict uses no retry.
          FABRIK_RUN_REVIEW: ${{ needs.kit.outputs.route == 'implement' && needs.kit.outputs.review || '' }}
          FABRIK_AGENT_RESULT: ${{ (needs.kit.outputs.route != 'push' && !(needs.kit.outputs.route == 'review' && needs.review-checks.outputs.checks == 'red')) && format('{0}/agent/agent-result.json', runner.temp) || '' }}
          # A Review's PR, and what its checks job saw, which the agent can't rewrite.
          FABRIK_REVIEW_PULL_REQUEST: ${{ needs.kit.outputs.route == 'review' && needs.kit.outputs.pull-request || '' }}
          FABRIK_REVIEW_HEAD_SHA: ${{ needs.review-checks.outputs.head-sha }}
          FABRIK_REVIEW_FAILED_CHECKS: ${{ needs.review-checks.outputs.failed }}
        run: node src/main.ts

  # Dispatch (ADR-0001): runs when the push job's plan asked for a check, on a
  # fresh snapshot taken after that plan's labels landed. Like a push job, it
  # never checks out or runs Product code.
  dispatch:
    name: Dispatch
    needs: [kit, push]
    if: ${{ !cancelled() && needs.push.result == 'success' && needs.push.outputs.dispatch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.dispatch-timeout-minutes) }}
    # One check at a time, so two can't both fill the same free slot. A newer
    # pending check replacing an older one is fine: each reads fresh state.
    concurrency:
      group: fabrik-dispatch
      cancel-in-progress: false
    permissions:
      # Only to count Implement runs in progress; the Fabrik App has no Actions permission.
      actions: read
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: .fabrik-kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      # The App token adds agent:implement, so the label starts the Implement run.
      - name: Run a Dispatch check
        working-directory: .fabrik-kit
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
          FABRIK_ACTIONS_TOKEN: ${{ github.token }}
          FABRIK_DISPATCH_CHECK: "true"
        run: node src/main.ts
