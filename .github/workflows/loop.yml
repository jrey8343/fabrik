# The Fabrik Loop, called from a Product repo's .github/workflows/fabrik.yml.
#
# This file is wiring only. Every decision comes from the Kit's code: the Loop
# rules core (src/loop/rules.ts), which the push job runs through src/main.ts,
# and the routing in src/kit/jobs.ts.
#
# Each AFK role is an agent job followed by the push job (ADR-0002):
# - The agent job holds `contents: read` and no GitHub write credential, no
#   `id-token: write`, and only the agent service account, which loads the
#   Claude token (ADR-0004). It passes its output out as an artifact.
# - The push job runs on a fresh VM, loads the Fabrik App key through the push
#   service account, mints an App token, and never checks out or runs Product
#   code. It checks out only Fabrik itself, at the exact commit the caller pinned.
# - The failure job runs instead of the push job when the agent job failed or
#   was cancelled (its timeout-minutes included). Like the push job it never
#   touches Product code; it posts the failure notice through src/main.ts.
name: Fabrik Loop

on:
  workflow_call:
    secrets:
      OP_AGENT_TOKEN:
        description: The Product repo's read-only 1Password agent service account, which reads the Fabrik vault (the Claude token).
        required: true
      OP_PUSH_TOKEN:
        description: The Product repo's read-only 1Password push service account, which reads the Fabrik App vault.
        required: true

permissions: {}

jobs:
  kit:
    name: Kit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only to read this workflow's own commit from the job's OIDC token.
      id-token: write
      contents: read
    outputs:
      sha: ${{ steps.kit.outputs.sha }}
      route: ${{ steps.route.outputs.route }}
      triage-timeout-minutes: ${{ steps.route.outputs.triage-timeout-minutes }}
    steps:
      # No expression context names the commit of a called workflow, so read
      # it from the OIDC token's job_workflow_sha claim.
      - name: Find the Kit's pinned commit
        id: kit
        run: |
          set -euo pipefail
          jwt="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r .value)"
          claims="$(node -e 'process.stdout.write(Buffer.from(process.argv[1].split(".")[1], "base64url").toString())' "$jwt")"
          ref="$(jq -r .job_workflow_ref <<<"$claims")"
          sha="$(jq -r .job_workflow_sha <<<"$claims")"
          case "$ref" in
            jrey8343/fabrik/.github/workflows/loop.yml@*) ;;
            *) echo "::error::Unexpected Kit workflow ref: $ref"; exit 1 ;;
          esac
          echo "Kit: $ref ($sha)"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ steps.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # Read as data only; nothing from the Product repo runs in this job.
      - name: Check out the Product's Kit config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          sparse-checkout: .fabrik
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate the Kit config and route the event
        id: route
        run: node kit/src/kit/jobs.ts product

  triage:
    name: Triage
    needs: kit
    if: needs.kit.outputs.route == 'triage'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.triage-timeout-minutes) }}
    concurrency:
      group: fabrik-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      # Read by the failure job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
    steps:
      - name: Check out the Product repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          persist-credentials: false

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the Kit (Sandcastle and the Claude Code CLI, pinned)
        working-directory: kit
        run: npm ci

      - name: Fetch the pinned skills into .claude/skills
        run: node kit/src/skills/fetch.ts product

      # The agent gets the issue in its prompt, never a GitHub token.
      - name: Read the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json number,title,body,author,labels,comments >"$RUNNER_TEMP/issue.json"

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/Claude token/credential

      - name: Run Triage
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
        run: node ../kit/src/agent/run.ts triage

      - name: Pass the Triage output to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/fabrik-out/agent-result.json
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure. A run cancelled
      # by its timeout leaves none, and the failure job reads that as a timeout.
      - name: Pass the failure report to the failure job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

  triage-failed:
    name: Triage failed
    needs: [kit, triage]
    # always(), so this still runs when the Triage job was cancelled by its timeout.
    if: >-
      always() && needs.kit.result == 'success' && needs.kit.outputs.route == 'triage' &&
      (needs.triage.result == 'failure' || needs.triage.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: .fabrik-kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Take the agent job's failure report, if it left one
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/agent

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      - name: Post the failure notice
        working-directory: .fabrik-kit
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
          FABRIK_FAILED_ROLE: triage
          FABRIK_FAILED_ISSUE: ${{ github.event.issue.number }}
          FABRIK_AGENT_JOB_RESULT: ${{ needs.triage.result }}
          FABRIK_SECRETS_STEP: ${{ needs.triage.outputs.secrets-step }}
          FABRIK_AGENT_FAILURE: ${{ runner.temp }}/agent/agent-failure.json
        run: node src/main.ts

  push:
    name: Push
    needs: [kit, triage]
    # Runs straight after the Kit job, or after an agent job that succeeded.
    if: >-
      !cancelled() && needs.kit.result == 'success' &&
      (needs.triage.result == 'success' || (needs.kit.outputs.route == 'push' && needs.triage.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: .fabrik-kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Take the agent job's output
        if: needs.kit.outputs.route != 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/agent

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      # The App token, not GITHUB_TOKEN, so the labels it adds start later workflows.
      - name: Run the Loop
        working-directory: .fabrik-kit
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
          FABRIK_AGENT_RESULT: ${{ needs.kit.outputs.route != 'push' && format('{0}/agent/agent-result.json', runner.temp) || '' }}
        run: node src/main.ts
