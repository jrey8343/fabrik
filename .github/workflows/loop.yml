# The Fabrik Loop, called from a Product repo's .github/workflows/fabrik.yml.
#
# This file is wiring only. Every decision comes from the Kit's code: the Loop
# rules core (src/loop/rules.ts), which the push job runs through src/main.ts,
# and the routing in src/kit/jobs.ts.
#
# Each AFK role is an agent job followed by the push job (ADR-0002):
# - The agent job holds `contents: read` and no GitHub write credential, no
#   `id-token: write`, and only the agent service account, which loads the
#   Claude token, or, for Implement and a Design session's prototype turn,
#   only the implement service account, which also loads the repo's test
#   secrets (ADR-0004). It passes its output out as an artifact, the
#   Implementer's commits, the prototype turn's variants and the Researcher's
#   findings branch as a git bundle.
# - The push job runs on a fresh VM, loads the Fabrik App key through the push
#   service account, mints an App token, and never checks out or runs Product
#   code. It checks out only Fabrik itself, at the exact commit the caller
#   pinned. When the agent job failed or was cancelled (its timeout-minutes
#   included), it posts the failure notice instead.
#
# Scoring (#149) follows the same split. The push job's record step plans
# whether the Implement run it recorded is scored. When it is, the judge job
# (`score`) runs the judge with no tools and no write credential, and the
# score-record job, the judge run's own push job, writes what it came to.
#
# A Retro run (#151) is two jobs before the push job. The Retro evidence job,
# shaped like the push job, reads this repo's paths in fabrik-runs with a
# Contents-read token and runs no agent and no Product code (ADR-0009's
# addendum). The Retro job then runs the agent on that evidence, read-only.
#
# A replay Ticket's run (#156) starts when the scheduled tick adds agent:replay
# to a replay issue. The claim job takes the label off and marks the Ticket in
# progress in this run. Then each arm, baseline and variant, runs as a matrix
# leg of four jobs: replay implement and replay gates, which hold no write
# credential, replay review and replay score. None of them is named
# `Implement`, so Dispatch never counts them. Last, the replay-record job, the
# replay's own push job (ADR-0009's addendum), writes both arms to fabrik-runs
# and lands the run on the replay issue. The push job never runs on it.
#
# The steps these jobs share are composite actions in .github/actions/, used
# from the Kit's own checkout at kit/: prepare-agent readies an agent job, and
# run-loop runs the Loop as the Fabrik App.
name: Fabrik Loop

on:
  workflow_call:
    secrets:
      OP_AGENT_TOKEN:
        description: The Product repo's read-only 1Password agent service account, which reads the Fabrik vault (the Claude token).
        required: true
      OP_IMPLEMENT_TOKEN:
        description: The Product repo's read-only 1Password implement service account, which reads the Fabrik vault (the Claude token) and the repo's Fabrik Sandbox vault (its test secrets).
        required: true
      OP_PUSH_TOKEN:
        description: The Product repo's read-only 1Password push service account, which reads the Fabrik App vault.
        required: true

permissions: {}

jobs:
  kit:
    name: Kit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only to read this workflow's own commit from the job's OIDC token.
      id-token: write
      contents: read
      # To read the issue, or the pull request, for the Loop rules core's snapshot.
      issues: read
      pull-requests: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      route: ${{ steps.route.outputs.route }}
      triage-timeout-minutes: ${{ steps.route.outputs.triage-timeout-minutes }}
      design-timeout-minutes: ${{ steps.route.outputs.design-timeout-minutes }}
      implement-timeout-minutes: ${{ steps.route.outputs.implement-timeout-minutes }}
      implement-job-timeout-minutes: ${{ steps.route.outputs.implement-job-timeout-minutes }}
      review-timeout-minutes: ${{ steps.route.outputs.review-timeout-minutes }}
      audit-timeout-minutes: ${{ steps.route.outputs.audit-timeout-minutes }}
      # Both of a Retro run's jobs, its evidence job and its Retro job, run within it.
      retro-timeout-minutes: ${{ steps.route.outputs.retro-timeout-minutes }}
      research-timeout-minutes: ${{ steps.route.outputs.research-timeout-minutes }}
      digest-timeout-minutes: ${{ steps.route.outputs.digest-timeout-minutes }}
      dispatch-timeout-minutes: ${{ steps.route.outputs.dispatch-timeout-minutes }}
      # For a Review, a Digest run or a retry: the agent PR, and the Ticket its branch was cut for.
      # For a first Implement run: its Ticket, with no PR. For a replay: the Ticket it replays, and its merged PR.
      pull-request: ${{ steps.route.outputs.pull-request }}
      ticket: ${{ steps.route.outputs.ticket }}
      # For a replay (#156): the replay issue, and the Ticket's baseSha, which both arms start from.
      replay-issue: ${{ steps.route.outputs.replay-issue }}
      base-sha: ${{ steps.route.outputs.base-sha }}
      # For a replay: each arm's settings, as one line of JSON. Its model names come from the replay
      # issue's body, so a job reads it only through an action's inputs, never in a `run:` script.
      replay-arms: ${{ steps.route.outputs.replay-arms }}
      # For a replay whose variant's candidate Kit sha this job couldn't lay (#449): why, so neither arm runs and the
      # replay-record job fails the Ticket once, naming it; empty otherwise.
      replay-kit-sha-unavailable: ${{ steps.route.outputs.replay-kit-sha-unavailable }}
      # For a retry, or a Kept-branch start (#536): the agent branch it builds on, which the Implement job checks out.
      branch: ${{ steps.route.outputs.branch }}
      # For a Kept-branch start (#536): "true", which the Implement job carries on the branch on and the push job lands
      # it as a first run that carried on; the PR the Kit closed, which its new PR names, empty when unknown; and the
      # default branch that PR opens against. "false" and empty for any other run.
      kept-branch: ${{ steps.route.outputs.kept-branch }}
      kept-pull-request: ${{ steps.route.outputs.kept-pull-request }}
      default-branch: ${{ steps.route.outputs.default-branch }}
      # For a Request-changes run: the Operator's review, its input. It runs as a retry otherwise does.
      review: ${{ steps.route.outputs.review }}
      # For a conflict-only run (#304): the default branch head it rebases the PR's branch onto, a full sha.
      conflict: ${{ steps.route.outputs.conflict }}
      # For a run on an agent PR's branch (#341): main's head as this job read it, before the run started. The push job
      # takes it, and main as it is then, for the only heads the run may have brought in: the agent job can't write it.
      main-at-start: ${{ steps.route.outputs.main-at-start }}
      # For an Auditor run: the pending Audit's marked commit, which the Audit job checks out.
      audit-commit: ${{ steps.route.outputs.audit-commit }}
      # For a Digest run (ADR-0022): the head its pass was given on, a full sha, which the Digest job checks out and
      # the push job lands the Digest for.
      head-sha: ${{ steps.route.outputs.head-sha }}
      # The model and effort the plan chose for its agent run, a Step-up included.
      model: ${{ steps.route.outputs.model }}
      effort: ${{ steps.route.outputs.effort }}
      # Which run the plan started, for its Run record: its Retry number (0 for none), "true"
      # or "false" for whether it Steps up and whether it's the Operator's Request-changes run,
      # and why it Steps up (retry, marked, request-changes or conflict-only; empty for none).
      retry: ${{ steps.route.outputs.retry }}
      # For a Retry on an agent PR (#341): the head its Execution flaw was given on, which the push job lands it for.
      retry-flaw: ${{ steps.route.outputs.retry-flaw }}
      step-up: ${{ steps.route.outputs.step-up }}
      step-up-reason: ${{ steps.route.outputs.step-up-reason }}
      request-changes: ${{ steps.route.outputs.request-changes }}
      # The Subscription the plan's agent run is given: the Fabrik vault item its
      # job loads the Claude token from. Only ever a vault item name from the
      # Kit config this job checked, never a secret.
      subscription: ${{ steps.route.outputs.subscription }}
      # "true" when Subscription rotation is on, for the judge, which reads no Kit config.
      rotation: ${{ steps.route.outputs.rotation }}
      # For a Review of a UI PR: where its UI evidence marker says the evidence is kept, the
      # Implement run that captured it and that run's artifact of the screenshots (empty when
      # it kept none), which the Review job downloads, and why its capture failed, as the
      # marker records it (empty when it captured, or records no outcome). Empty for any other run.
      ui-evidence-run: ${{ steps.route.outputs.ui-evidence-run }}
      ui-evidence-artifact: ${{ steps.route.outputs.ui-evidence-artifact }}
      ui-evidence-failure: ${{ steps.route.outputs.ui-evidence-failure }}
      # "true" when the Design run is a Design session's prototype turn, else "false".
      prototype: ${{ steps.route.outputs.prototype }}
      # For a prototype turn, its request as one line of JSON (route, variants, brief, reply); else empty.
      # The one output that holds agent text, the Design agent's brief, so a job reads it only through
      # `env:`, never in a `run:` script, where it could inject a command.
      prototype_request: ${{ steps.route.outputs.prototype_request }}
      # What this job routed, held and declined included, as one line of JSON (src/kit/kitSaid.ts, #616): the
      # closing step's name. It holds no text a person or an agent wrote.
      kit-said: ${{ steps.route.outputs.kit-said }}
    steps:
      # No expression context names a called workflow's ref or commit, so read
      # them from the OIDC token's job_workflow_ref and job_workflow_sha claims.
      - name: Read the Kit's workflow ref from the OIDC token
        id: kit
        run: |
          set -euo pipefail
          jwt="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r .value)"
          claims="$(node -e 'process.stdout.write(Buffer.from(process.argv[1].split(".")[1], "base64url").toString())' "$jwt")"
          ref="$(jq -r .job_workflow_ref <<<"$claims")"
          sha="$(jq -r .job_workflow_sha <<<"$claims")"
          case "$ref" in
            jrey8343/fabrik/.github/workflows/loop.yml@*) ;;
            *) echo "::error::Unexpected Kit workflow ref: $ref"; exit 1 ;;
          esac
          echo "workflow-ref=$ref" >>"$GITHUB_OUTPUT"
          echo "workflow-sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ steps.kit.outputs.workflow-sha }}
          path: kit
          persist-credentials: false

      # A pinned annotated tag's claim names the tag object, not its commit. The checkout
      # peels it, so pass out the commit it landed on: every job checks the Kit out at it,
      # and every Run record names it as its kitSha (#324).
      - name: Peel the Kit's pinned commit
        id: commit
        env:
          KIT_REF: ${{ steps.kit.outputs.workflow-ref }}
        run: |
          set -euo pipefail
          sha="$(git -C kit rev-parse HEAD)"
          echo "Kit: $KIT_REF at commit $sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # Read as data only; nothing from the Product repo runs in this job. The
      # workflows folder holds the caller workflow, whose Fabrik pins are checked too.
      - name: Check out the Product's Kit config and caller workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          sparse-checkout: |
            .fabrik
            .github/workflows
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the Kit config and caller workflow, and route the event
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node kit/src/kit/jobs.ts product

      # Says what the routing step routed, held and declined included, in its name, for a reader of Actions while
      # the run is in flight (#616). It does nothing, and runs only when routing succeeded: a Kit job that failed
      # says so by failing, with no line.
      - name: ${{ steps.route.outputs.kit-said }}
        run: "true"

  triage:
    name: Triage
    needs: kit
    if: needs.kit.outputs.route == 'triage'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.triage-timeout-minutes) }}
    concurrency:
      group: fabrik-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    # pull-requests: read for the input step: the Operator may add needs-triage to
    # a Ticket sent back from an agent PR, whose closed PR it reads (#328).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      # Read by the push job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
      # For its Run record: the model and effort the runner passed, and the commit the run started from.
      model: ${{ steps.agent.outputs.model }}
      effort: ${{ steps.agent.outputs.effort }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Check out the Product repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          persist-credentials: false

      # Before the secrets load, so a run whose agent never started still names it.
      - name: Note the commit the run starts from
        id: base
        run: echo "sha=$(git -C product rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Prepare the agent job
        uses: ./kit/.github/actions/prepare-agent
        with:
          role: triage
          github-token: ${{ github.token }}
          issue: ${{ github.event.issue.number }}

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/${{ needs.kit.outputs.subscription }}/credential

      - name: Run Triage
        id: agent
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          # The open issues and those closed in the last 30 days, which Triage compares the issue against for a duplicate (#363).
          FABRIK_RECENT_ISSUES_FILE: ${{ runner.temp }}/recent-issues.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
        run: node ../kit/src/agent/run.ts triage

      - name: Pass the Triage output to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/fabrik-out/agent-result.json
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure. A run cancelled
      # by its timeout leaves none, and the push job reads that as a timeout.
      - name: Pass the failure report to the push job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

      # The agent's stream-json transcript (src/agent/transcript.ts), written line by
      # line as it ran, so it's kept when the run passed, failed or timed out. Not
      # fabrik-agent-*: the push job downloads those and reads none as a timeout.
      # continue-on-error: keeping it must never fail a run that passed.
      - name: Gzip the agent's transcript
        if: always()
        continue-on-error: true
        run: if [ -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl" ]; then gzip -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl"; fi

      - name: Keep the agent's transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-transcript-triage
          path: ${{ runner.temp }}/fabrik-out/transcript.jsonl.gz
          if-no-files-found: ignore
          retention-days: 7

  # Named for its issue: a Design queue check reads the issues with a turn in
  # progress from these names (DESIGN_JOB_NAME in src/github/snapshot.ts).
  design:
    name: "Design-session turn #${{ github.event.issue.number }}"
    needs: kit
    # A prototype turn of the session runs in the prototype job instead.
    if: needs.kit.outputs.route == 'design' && needs.kit.outputs.prototype != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.design-timeout-minutes) }}
    # One turn per issue at a time. queue: max keeps every queued Operator reply
    # instead of letting a newer one cancel the one already waiting.
    concurrency:
      group: fabrik-design-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    # pull-requests: read for the input step: on a Ticket sent back from an agent
    # PR, it reads that closed PR into issue.json's sentBack (readSentBack in
    # src/agent/inputs.ts). Without it the turn fails before its agent starts (#328).
    # On an issue filed from a pull request, it reads that pull request too
    # (readFiledFrom, #659). contents: read is all the fetch of that pull
    # request's head takes (#660), so the job holds what it held.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      # Read by the push job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
      # For its Run record: the model and effort the runner passed, and the commit the run started from.
      model: ${{ steps.agent.outputs.model }}
      effort: ${{ steps.agent.outputs.effort }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Check out the Product repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          persist-credentials: false

      # Before the secrets load, so a run whose agent never started still names it.
      - name: Note the commit the run starts from
        id: base
        run: echo "sha=$(git -C product rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # Each turn rebuilds its context from the issue thread, and a Ticket's from its
      # parent Spec too, so a Ticket sent back to design is split under it. An issue
      # filed from a pull request has that pull request read afresh here too (#659).
      - name: Prepare the agent job
        uses: ./kit/.github/actions/prepare-agent
        with:
          role: design
          github-token: ${{ github.token }}
          issue: ${{ github.event.issue.number }}

      # When that pull request is an open agent pull request, the turn reads its
      # branch: its head is fetched to refs/fabrik/filed-from/<n>, with the history
      # to compare it with the default branch, which stays checked out (#660). The
      # token goes to this step's git alone, in its environment: none is written to
      # the checkout or passed on, so the agent still holds no GitHub credential
      # (ADR-0002). A fetch that fails fails the turn here, before its agent starts,
      # and leaves the failure report the push job's notice quotes.
      - name: Fetch the head of the pull request this issue was filed from
        env:
          GH_TOKEN: ${{ github.token }}
          FABRIK_FILED_FROM_FILE: ${{ runner.temp }}/filed-from.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
        run: node kit/src/agent/filedFromFetch.ts product

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/${{ needs.kit.outputs.subscription }}/credential

      - name: Run the Design-session turn
        id: agent
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_SPEC_FILE: ${{ runner.temp }}/spec.json
          FABRIK_MAP_FILE: ${{ runner.temp }}/map.json
          FABRIK_SPEC_TICKETS_FILE: ${{ runner.temp }}/spec-tickets.json
          FABRIK_FILED_FROM_FILE: ${{ runner.temp }}/filed-from.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
        run: node ../kit/src/agent/run.ts design

      - name: Pass the turn's output to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/fabrik-out/agent-result.json
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure. A run cancelled
      # by its timeout leaves none, and the push job reads that as a timeout.
      - name: Pass the failure report to the push job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

      # The agent's stream-json transcript (src/agent/transcript.ts), written line by
      # line as it ran, so it's kept when the run passed, failed or timed out. Not
      # fabrik-agent-*: the push job downloads those and reads none as a timeout.
      # continue-on-error: keeping it must never fail a run that passed.
      - name: Gzip the agent's transcript
        if: always()
        continue-on-error: true
        run: if [ -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl" ]; then gzip -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl"; fi

      - name: Keep the agent's transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-transcript-design
          path: ${{ runner.temp }}/fabrik-out/transcript.jsonl.gz
          if-no-files-found: ignore
          retention-days: 7

  # A Design session's prototype turn (#155), in the design job's place when
  # the Kit job's plan made the Design run one: the Design agent, on the
  # Design model, builds the approved variants of one route on the issue's
  # prototype branch, which the runner passes out as a git bundle, as an
  # Implement run's commits. It builds and serves the Product, so, like the
  # Implement job, it holds the implement service account (the Claude token
  # and this repo's test secrets, in its agent step's env only), no GitHub
  # write credential, and the Implement timeouts. Named for its issue, as the
  # design job is: a Design queue check reads it as the session's turn in
  # progress (PROTOTYPE_JOB_NAME in src/github/snapshot.ts).
  prototype:
    name: "Prototype turn #${{ github.event.issue.number }}"
    needs: kit
    if: needs.kit.outputs.route == 'design' && needs.kit.outputs.prototype == 'true'
    runs-on: ubuntu-latest
    # Its agent step stops at the Implement role's own timeout; this leaves room
    # for capture after it (implementJobTimeoutMinutes in src/evidence/capture.ts).
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.implement-job-timeout-minutes) }}
    # A turn of the Design session, so one at a time with its other turns.
    concurrency:
      group: fabrik-design-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    # pull-requests: read for the input step, as the design job's: a prototype
    # turn on a Ticket sent back from an agent PR reads that closed PR (#328).
    # The step reads the pull request an issue was filed from here too, under the
    # Design role, and this job hands its agent step nothing of it (#659).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      # Read by the push job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
      # For its Run record: the model and effort the runner passed, and the commit the run started from.
      model: ${{ steps.agent.outputs.model }}
      effort: ${{ steps.agent.outputs.effort }}
      base-sha: ${{ steps.base.outputs.sha }}
      # "true" when the agent step's own timeout stopped it, which the push job reads as a timeout (src/kit/pushJob.ts).
      agent-timed-out: ${{ steps.agent-time.outputs.timed-out }}
      # The variants' capture, for the push job, under the names the Implement job
      # passes UI evidence out by: the capture result as one compact JSON line,
      # empty when nothing was captured, the numeric id of the zipped captures'
      # artifact, which the prototype round names with this run (#638), and
      # that of the unzipped Evidence page's, which the push job links from its own run.
      ui-capture-result: ${{ steps.capture.outputs.ui-capture-result }}
      ui-evidence-artifact: ${{ steps.evidence.outputs.artifact-id }}
      ui-evidence-page-artifact: ${{ steps.evidence-page.outputs.artifact-id }}
    steps:
      # A fresh clone, with every branch's history, for the bundle and the guard.
      - name: Check out the Product repo's default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # A later prototype round builds on the branch an earlier one pushed. A
      # first one stays on the default branch, and the runner cuts the branch
      # from it (src/agent/prototype.ts).
      - name: Check out the issue's prototype branch, if an earlier round pushed it
        working-directory: product
        env:
          BRANCH: prototype/${{ github.event.issue.number }}
        run: |
          if git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" >/dev/null; then
            git checkout --quiet -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          fi

      # Before the secrets load, so a run whose agent never started still names it.
      - name: Note the commit the run starts from
        id: base
        run: echo "sha=$(git -C product rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # A turn of the Design session, so it gets the Design role's Extra skills,
      # beside the Base skills, which hold the prototype skill.
      - name: Prepare the agent job
        uses: ./kit/.github/actions/prepare-agent
        with:
          role: design
          github-token: ${{ github.token }}
          issue: ${{ github.event.issue.number }}

      # Kit config is read as data; the list of op:// references goes to 1Password as a file.
      - name: List the test secrets to load
        run: node kit/src/kit/secrets-main.ts product "$RUNNER_TEMP/fabrik-secrets.env"

      - name: Load the Claude token and the test secrets
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_IMPLEMENT_TOKEN }}
          OP_ENV_FILE: ${{ runner.temp }}/fabrik-secrets.env
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/${{ needs.kit.outputs.subscription }}/credential

      # So an agent step its timeout stopped can be told from one that failed for any other reason.
      - name: Note when the prototype turn starts
        id: started
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Run the prototype turn
        id: agent
        working-directory: product
        # The Implement role's own timeout, on the step rather than the job, so capture can run after it.
        timeout-minutes: ${{ fromJSON(needs.kit.outputs.implement-timeout-minutes) }}
        env:
          # Every value the 1Password step resolved, in this step's env only.
          FABRIK_SECRETS: ${{ toJSON(steps.op.outputs) }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          # The approved request, as one line of JSON. It holds the Design agent's brief, so it
          # reaches the runner through env: only, never in a run: script.
          FABRIK_PROTOTYPE_REQUEST: ${{ needs.kit.outputs.prototype_request }}
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_MODEL: ${{ needs.kit.outputs.model }}
          FABRIK_EFFORT: ${{ needs.kit.outputs.effort }}
        run: node ../kit/src/agent/run.ts prototype

      # The agent step's own timeout fails the job, where a job timeout cancels
      # it: note it, so the push job reads it as a timeout all the same.
      - name: Note whether the prototype turn ran out of time
        id: agent-time
        if: failure() && steps.agent.outcome == 'failure'
        env:
          STARTED_AT: ${{ steps.started.outputs.at }}
          TIMEOUT_MINUTES: ${{ needs.kit.outputs.implement-timeout-minutes }}
        run: |
          if [ "$(( $(date +%s) - STARTED_AT ))" -ge "$(( TIMEOUT_MINUTES * 60 ))" ]; then
            echo "timed-out=true" >>"$GITHUB_OUTPUT"
          fi

      # The variants, once the agent has ended, with #153's capture: it builds and
      # serves the branch, then screenshots and films each variant at the
      # approved route with ?variant= and its letter, at both Kit viewports, and
      # writes them, the capture result and the prototype's Evidence page under
      # fabrik-out (src/evidence/capture-main.ts). It records every failure in
      # the capture result, never the job's: continue-on-error, and its own
      # timeout, the Kit's CAPTURE_TIMEOUT_MINUTES. No secret reaches it, nor
      # the build, server and sign-ins it runs.
      - name: Capture the variants
        id: capture
        if: success()
        continue-on-error: true
        timeout-minutes: 20
        working-directory: product
        env:
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The approved request, whose route capture serves: agent text, so through env: only.
          FABRIK_PROTOTYPE_REQUEST: ${{ needs.kit.outputs.prototype_request }}
        run: node ../kit/src/evidence/capture-main.ts prototype

      # The result and the bundle of the variants' commits (none if it made none).
      - name: Pass the prototype turn's output and commits to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: |
            ${{ runner.temp }}/fabrik-out/agent-result.json
            ${{ runner.temp }}/fabrik-out/agent-branch.bundle
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure. A run its
      # timeout stopped leaves none, and the push job reads that as a timeout.
      # With it, the bundle of any commits the run made before it failed
      # (#431): never pushed, kept for the Operator, as the notice says.
      - name: Pass the failure report to the push job
        if: failure() && steps.agent-time.outputs.timed-out != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: |
            ${{ runner.temp }}/fabrik-out/agent-failure.json
            ${{ runner.temp }}/fabrik-out/agent-branch.bundle
          if-no-files-found: ignore
          retention-days: 7

      # What capture recorded, whether it captured or failed (#638): each
      # variant's screenshots and video and the capture result, as capture
      # wrote them, zipped, kept 30 days, as the Implement job keeps a PR's UI
      # evidence; the prototype round names the run and this artifact. Named
      # as the Implement job's upload is, since no run has both jobs. Not
      # fabrik-agent-*: the push job downloads those and reads none as a
      # timeout. continue-on-error: keeping it must never fail a turn that passed.
      - name: Keep the prototype's captures
        id: evidence
        if: steps.capture.outputs.ui-capture-result != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-ui-evidence
          path: ${{ runner.temp }}/fabrik-out/ui-evidence/
          if-no-files-found: ignore
          retention-days: 30

      # The prototype's Evidence page, unzipped, so it opens in the browser in one click,
      # kept about 30 days; the prototype round is the lasting record. An
      # unzipped artifact is one file, named after it; a capture that took no
      # screenshot leaves none. Not fabrik-agent-*: the push job downloads those
      # and reads none as a timeout. continue-on-error: keeping it must never
      # fail a turn that passed.
      - name: Keep the prototype's Evidence page
        id: evidence-page
        if: steps.capture.outputs.ui-capture-result != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/fabrik-out/fabrik-prototype-evidence-page.html
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      # The agent's stream-json transcript (src/agent/transcript.ts), written line by
      # line as it ran, so it's kept when the run passed, failed or timed out. Not
      # fabrik-agent-*: the push job downloads those and reads none as a timeout.
      # Named for the design route, which the push job's record step takes it by.
      # continue-on-error: keeping it must never fail a run that passed.
      - name: Gzip the agent's transcript
        if: always()
        continue-on-error: true
        run: if [ -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl" ]; then gzip -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl"; fi

      - name: Keep the agent's transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-transcript-design
          path: ${{ runner.temp }}/fabrik-out/transcript.jsonl.gz
          if-no-files-found: ignore
          retention-days: 7

  # Takes agent:implement off the Ticket as its Implement run starts, so the
  # label never claims work that isn't running (the open draft PR does that),
  # agent:research off a research Decision as its Research run starts (the
  # running job holds the slot), and agent:design off an issue as its Design
  # session's first turn, or a prototype turn, starts (the running turn, then
  # its round, hold the slot), marking a prototype turn's request started on
  # the request's own comment (src/loop/design.ts), and agent:replay off a
  # replay issue as its next Ticket's run starts, marking that Ticket in
  # progress in this run (src/loop/replayRun.ts). It applies the same plan
  # the Kit job routed on; the run itself is the agent job's. Like the push
  # job, it never touches Product code.
  implement-claim:
    name: Claim the work
    needs: kit
    if: needs.kit.outputs.route == 'implement' || needs.kit.outputs.route == 'research' || needs.kit.outputs.route == 'replay' || (needs.kit.outputs.route == 'design' && github.event.label.name == 'agent:design')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One replay claim at a time across the repo, since one replay Ticket runs at a time across
    # every replay issue: a claim waiting here reads the one before it. Every other claim runs at once.
    concurrency:
      group: ${{ needs.kit.outputs.route == 'replay' && 'fabrik-replay-claim' || format('fabrik-claim-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    permissions: {}
    outputs:
      # For a replay: the Ticket the claim marked in progress in this run, empty when it marked
      # none, as when another run claimed it first. The replay jobs run only on that Ticket.
      replay-ticket: ${{ steps.claim.outputs.replay-ticket }}
    env:
      # Tells src/main.ts this is the claim job, so a claim that fails says so on the issue (#421).
      FABRIK_CLAIM: "true"
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Take the trigger label off as the run starts
        id: claim
        uses: ./kit/.github/actions/run-loop
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}

  # The Implementer (ADR-0002, ADR-0004). It holds only the implement service
  # account: the Claude token and this repo's test secrets, which Kit config
  # declares as op:// references, so none of them is named in this file. They
  # are resolved in output mode and reach the Implement step's env only.
  # Named "Implement #<Ticket>", and a retry's " (Retry <n>)" after it, so the Actions tab says which Ticket
  # it's on (#477): Dispatch counts jobs by this name (IMPLEMENT_JOB_NAME in src/github/snapshot.ts).
  implement:
    name: "Implement #${{ needs.kit.outputs.ticket }}${{ needs.kit.outputs.retry != '0' && needs.kit.outputs.retry != '' && format(' (Retry {0})', needs.kit.outputs.retry) || '' }}"
    needs: kit
    if: needs.kit.outputs.route == 'implement'
    runs-on: ubuntu-latest
    # Its agent step stops at the Implement role's own timeout; this leaves room
    # for UI evidence capture after it, so capture never cancels the job before
    # its result uploads (implementJobTimeoutMinutes in src/evidence/capture.ts).
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.implement-job-timeout-minutes) }}
    # One Implement run per Ticket at a time, so two never race on one branch.
    # A retry starts from a PR event, so the Ticket comes from the Kit job.
    concurrency:
      group: fabrik-implement-${{ needs.kit.outputs.ticket }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      # A retry reads its PR's Verdict comments, and a Request-changes run the Operator's review.
      pull-requests: read
    outputs:
      # Read by the push job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
      # For its Run record: the model and effort the runner passed, and the commit the run started from.
      model: ${{ steps.agent.outputs.model }}
      effort: ${{ steps.agent.outputs.effort }}
      base-sha: ${{ steps.base.outputs.sha }}
      # "true" when the agent step's own timeout stopped it, which the push job reads as a timeout (src/kit/pushJob.ts).
      agent-timed-out: ${{ steps.agent-time.outputs.timed-out }}
      # UI evidence (#153), for the push job: the capture result as one compact
      # JSON line, empty when nothing was captured, and the numeric ids of the
      # zipped screenshots-and-result artifact and the unzipped Evidence page's.
      ui-capture-result: ${{ steps.capture.outputs.ui-capture-result }}
      # "true" when capture's own timeout stopped it before it recorded a result (src/kit/pushJob.ts).
      ui-capture-timed-out: ${{ steps.capture-time.outputs.timed-out }}
      ui-evidence-artifact: ${{ steps.evidence.outputs.artifact-id }}
      ui-evidence-page-artifact: ${{ steps.evidence-page.outputs.artifact-id }}
    steps:
      # A fresh clone: no working directory or .env* files carried over. A first
      # run starts from main; a retry, or a Kept-branch start (#536), from the
      # Ticket's agent branch (the Kit job names it).
      - name: Check out the Product repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          ref: ${{ needs.kit.outputs.branch || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # Before the secrets load, so a run whose agent never started still names it.
      - name: Note the commit the run starts from
        id: base
        run: echo "sha=$(git -C product rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # The Ticket and its Spec; for a retry, its PR's comments (the Verdict to fix);
      # for a Request-changes run, the review the Kit job's plan checked is the Operator's.
      - name: Prepare the agent job
        uses: ./kit/.github/actions/prepare-agent
        with:
          # A Step-up run is an Implement run, so it gets implement's Extra skills too.
          role: implement
          github-token: ${{ github.token }}
          issue: ${{ needs.kit.outputs.ticket }}
          pull-request: ${{ needs.kit.outputs.pull-request }}
          pull-request-comments: "true"
          review: ${{ needs.kit.outputs.review }}

      # Kit config is read as data; the list of op:// references goes to 1Password as a file.
      - name: List the test secrets to load
        run: node kit/src/kit/secrets-main.ts product "$RUNNER_TEMP/fabrik-secrets.env"

      - name: Load the Claude token and the test secrets
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_IMPLEMENT_TOKEN }}
          OP_ENV_FILE: ${{ runner.temp }}/fabrik-secrets.env
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/${{ needs.kit.outputs.subscription }}/credential

      # So an agent step its timeout stopped can be told from one that failed for any other reason.
      - name: Note when the Implementer starts
        id: started
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Run the Implementer
        id: agent
        working-directory: product
        # The Implement role's own timeout, on the step rather than the job, so capture can run after it.
        timeout-minutes: ${{ fromJSON(needs.kit.outputs.implement-timeout-minutes) }}
        env:
          # Every value the 1Password step resolved, in this step's env only.
          FABRIK_SECRETS: ${{ toJSON(steps.op.outputs) }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_SPEC_FILE: ${{ runner.temp }}/spec.json
          FABRIK_PULL_REQUEST_FILE: ${{ needs.kit.outputs.pull-request != '' && format('{0}/pull-request.json', runner.temp) || '' }}
          FABRIK_REVIEW_FILE: ${{ needs.kit.outputs.review != '' && format('{0}/review.json', runner.temp) || '' }}
          # A conflict-only run's main head (#304): it rebases onto it and resolves the conflicts, nothing else.
          FABRIK_CONFLICT_MAIN: ${{ needs.kit.outputs.conflict }}
          # The branch a Request-changes run on a PR that conflicts with it merges in (#341), and a Kept-branch start too.
          FABRIK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # A Kept-branch start (#536): it carries on the branch checked out, and the PR its kept work came from.
          FABRIK_KEPT_BRANCH: ${{ needs.kit.outputs.kept-branch }}
          FABRIK_KEPT_PULL_REQUEST: ${{ needs.kit.outputs.kept-pull-request }}
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_MODEL: ${{ needs.kit.outputs.model }}
          FABRIK_EFFORT: ${{ needs.kit.outputs.effort }}
        run: node ../kit/src/agent/run.ts implement

      # The agent step's own timeout fails the job, where a job timeout cancels
      # it: note it, so the push job reads it as a timeout all the same.
      - name: Note whether the Implementer ran out of time
        id: agent-time
        if: failure() && steps.agent.outcome == 'failure'
        env:
          STARTED_AT: ${{ steps.started.outputs.at }}
          TIMEOUT_MINUTES: ${{ needs.kit.outputs.implement-timeout-minutes }}
        run: |
          if [ "$(( $(date +%s) - STARTED_AT ))" -ge "$(( TIMEOUT_MINUTES * 60 ))" ]; then
            echo "timed-out=true" >>"$GITHUB_OUTPUT"
          fi

      # UI evidence (#153), once the agent has ended: with a ui block, and a
      # branch that changes a ui.paths file against the default branch, it
      # builds and serves the branch, screenshots its routes, and writes the
      # screenshots, the capture result and the Evidence page under fabrik-out
      # (src/evidence/capture-main.ts). It records every failure in the capture
      # result, never the job's: continue-on-error, and its own timeout, the
      # Kit's CAPTURE_TIMEOUT_MINUTES (src/evidence/capture.ts; a test holds the
      # two together). No secret reaches it, nor the build, server and sign-ins
      # it runs.
      # So a capture step its own timeout stopped can be told from one that failed for any other reason.
      - name: Note when capture starts
        id: capture-started
        if: success()
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"

      # Without a ui block it captures nothing and passes out no result, so
      # neither upload below runs; the Kit job's step summary says Visual
      # evidence is off (src/kit/kitJob.ts).
      - name: Capture UI evidence
        id: capture
        if: success()
        continue-on-error: true
        timeout-minutes: 20
        working-directory: product
        env:
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node ../kit/src/evidence/capture-main.ts

      # Its own timeout kills capture before it records a result, which the push
      # job would read as none: note it, so the push job reads it as a timeout.
      # The Kit's CAPTURE_TIMEOUT_MINUTES, as on the step (a test holds the two together).
      - name: Note whether capture ran out of time
        id: capture-time
        if: steps.capture.outcome == 'failure'
        env:
          STARTED_AT: ${{ steps.capture-started.outputs.at }}
          TIMEOUT_MINUTES: 20
        run: |
          if [ "$(( $(date +%s) - STARTED_AT ))" -ge "$(( TIMEOUT_MINUTES * 60 ))" ]; then
            echo "timed-out=true" >>"$GITHUB_OUTPUT"
          fi

      # The result and the bundle of the Implementer's commits (none if it made none).
      - name: Pass the Implementer's output and commits to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: |
            ${{ runner.temp }}/fabrik-out/agent-result.json
            ${{ runner.temp }}/fabrik-out/agent-branch.bundle
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure. A run its
      # timeout stopped leaves none, and the push job reads that as a timeout.
      # With it, the bundle of any commits the run made before it failed
      # (#431): never pushed, kept for the Operator, as the notice says.
      - name: Pass the failure report to the push job
        if: failure() && steps.agent-time.outputs.timed-out != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: |
            ${{ runner.temp }}/fabrik-out/agent-failure.json
            ${{ runner.temp }}/fabrik-out/agent-branch.bundle
          if-no-files-found: ignore
          retention-days: 7

      # The UI evidence capture recorded, whether it captured or failed: the
      # screenshots and the capture result, zipped, for the Reviewer. Not
      # fabrik-agent-*: the push job downloads those and reads none as a timeout.
      # continue-on-error: keeping evidence must never fail a run that passed.
      - name: Keep the UI evidence
        id: evidence
        if: steps.capture.outputs.ui-capture-result != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-ui-evidence
          path: ${{ runner.temp }}/fabrik-out/ui-evidence/
          if-no-files-found: ignore
          retention-days: 30

      # The Evidence page, unzipped, so it opens in the browser in one click. An
      # unzipped artifact is one file, named after it; a capture that took no
      # screenshot leaves none.
      - name: Keep the UI Evidence page
        id: evidence-page
        if: steps.capture.outputs.ui-capture-result != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/fabrik-out/fabrik-ui-evidence-page.html
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      # The agent's stream-json transcript (src/agent/transcript.ts), written line by
      # line as it ran, so it's kept when the run passed, failed or timed out. Not
      # fabrik-agent-*: the push job downloads those and reads none as a timeout.
      # continue-on-error: keeping it must never fail a run that passed.
      - name: Gzip the agent's transcript
        if: always()
        continue-on-error: true
        run: if [ -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl" ]; then gzip -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl"; fi

      # With it, for the judge, the brief of what a run on an agent PR was asked beyond the Ticket (#450).
      - name: Keep the agent's transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-transcript-implement
          path: |
            ${{ runner.temp }}/fabrik-out/transcript.jsonl.gz
            ${{ runner.temp }}/fabrik-out/brief.md
          if-no-files-found: ignore
          retention-days: 7

  # A Review starts by waiting for the agent PR's required checks on its head.
  # check_suite events don't fire for Actions CI, so it polls, logging what it
  # waits on, and gives up a few minutes short of the Review timeout. It holds
  # only a read-only token and no secrets, and reads the Kit config as data.
  # Red checks the Kit can re-run go to the Re-run red checks job (#462); the
  # rest go straight to the push job as an Execution flaw, and the Reviewer
  # never runs. Giving up, or an error, fails the job with a failure report
  # naming why: a Required check the Kit config lists that never reported, the
  # checks still running, or the GitHub request that failed (src/review/wait.ts).
  review-checks:
    name: Review checks
    needs: kit
    if: needs.kit.outputs.route == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.review-timeout-minutes) }}
    concurrency:
      group: fabrik-review-checks-${{ needs.kit.outputs.pull-request }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      # Reading a PR's checks also reads each check's workflow run.
      actions: read
    outputs:
      checks: ${{ steps.wait.outputs.checks }}
      head-sha: ${{ steps.wait.outputs.head-sha }}
      failed: ${{ steps.wait.outputs.failed }}
      # On green, the checks that passed only by being skipped or reporting neutral, which the Reviewer and the Digest are told ran nothing (#456).
      ran-nothing: ${{ steps.wait.outputs.ran-nothing }}
      # On red, as JSON: the GitHub Actions checks the Kit can re-run, with their workflow runs, and the outside ones (#462).
      red: ${{ steps.wait.outputs.red }}
    steps:
      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # main's Kit config, read as data for the Required checks it lists.
      - name: Check out the Product's Kit config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          sparse-checkout: .fabrik
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Wait for the required checks
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          FABRIK_PULL_REQUEST: ${{ needs.kit.outputs.pull-request }}
          FABRIK_REVIEW_TIMEOUT_MINUTES: ${{ needs.kit.outputs.review-timeout-minutes }}
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
        run: node kit/src/review/wait.ts product

      # src/review/wait.ts writes this when it gives up or fails, for the push job's notice.
      - name: Pass the failure report to the push job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

  # Re-running red checks (#462, ADR-0018): the failed jobs of the workflow runs
  # behind the red GitHub Actions checks, once on the same head. The one job on
  # the Review path that holds a write credential: `actions: write` on the
  # workflow token, and nothing else. It loads no secret, checks out no Product
  # code and runs none. A run already re-run on this head isn't re-run again,
  # and a refusal re-runs nothing: the Verdict says why (src/review/rerun-main.ts).
  rerun-checks:
    name: Re-run red checks
    needs: [kit, review-checks]
    if: needs.kit.outputs.route == 'review' && needs.review-checks.outputs.checks == 'red'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      # The checks it re-ran, as JSON, empty or [] when it re-ran none; when it re-ran them; and why it re-ran none it could have.
      rerun: ${{ steps.rerun.outputs.rerun }}
      rerun-at: ${{ steps.rerun.outputs.rerun-at }}
      refused: ${{ steps.rerun.outputs.refused }}
    steps:
      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The check names come from the Product's CI, so the step reads them only through env:.
      - name: Re-run the red GitHub Actions checks
        id: rerun
        env:
          GH_TOKEN: ${{ github.token }}
          FABRIK_RED: ${{ needs.review-checks.outputs.red }}
        run: node kit/src/review/rerun-main.ts

  # The wait on the re-run checks (#462): the Review checks job's wait again, with
  # its own Review timeout, on the head the first wait read. It waits until the
  # re-run checks have reported again, then for every check it waits on. Green lets
  # the Reviewer run; red goes to the push job as an Execution flaw. Giving up,
  # or an error, is an Infrastructure failure, as the first wait's is.
  rerun-wait:
    name: Re-run checks' wait
    needs: [kit, review-checks, rerun-checks]
    if: needs.kit.outputs.route == 'review' && needs.rerun-checks.outputs.rerun != '' && needs.rerun-checks.outputs.rerun != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.review-timeout-minutes) }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    outputs:
      checks: ${{ steps.wait.outputs.checks }}
      head-sha: ${{ steps.wait.outputs.head-sha }}
      failed: ${{ steps.wait.outputs.failed }}
      ran-nothing: ${{ steps.wait.outputs.ran-nothing }}
      # The re-run checks that failed again, and the flaky ones with their red and green runs, as JSON.
      failed-again: ${{ steps.wait.outputs.failed-again }}
      flaky: ${{ steps.wait.outputs.flaky }}
    steps:
      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # main's Kit config, read as data for the Required checks it lists.
      - name: Check out the Product's Kit config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          sparse-checkout: .fabrik
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Wait for the re-run checks
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          FABRIK_PULL_REQUEST: ${{ needs.kit.outputs.pull-request }}
          FABRIK_REVIEW_TIMEOUT_MINUTES: ${{ needs.kit.outputs.review-timeout-minutes }}
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_HEAD_SHA: ${{ needs.review-checks.outputs.head-sha }}
          FABRIK_RERUN: ${{ needs.rerun-checks.outputs.rerun }}
          FABRIK_RERUN_AT: ${{ needs.rerun-checks.outputs.rerun-at }}
        run: node kit/src/review/wait.ts product

      # src/review/wait.ts writes this when it gives up or fails, for the push job's notice.
      - name: Pass the failure report to the push job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

  # The Reviewer (ADR-0002). Read-only: a checkout of the PR's head at the
  # commit its checks passed on, no GitHub write credential, and only the
  # agent service account. It runs none of the PR's code, and passes its
  # Verdict out as an artifact for the push job to post. On a UI PR it also
  # downloads the screenshots its Implement run captured, for the Reviewer to see.
  # Named "Review PR #<agent PR>", so the Actions tab says which PR it's on (#477): the stuck-trigger
  # sweep reads a Review under way by this name (REVIEW_JOB_NAME in src/github/snapshot.ts).
  review:
    name: "Review PR #${{ needs.kit.outputs.pull-request }}"
    needs: [kit, review-checks, rerun-checks, rerun-wait]
    # On green checks, at first or once the Kit re-ran the red ones (#462); !cancelled(), as the re-run jobs skip on green.
    if: >-
      !cancelled() && needs.kit.outputs.route == 'review' && needs.review-checks.result == 'success' &&
      (needs.review-checks.outputs.checks == 'green' || (needs.rerun-wait.result == 'success' && needs.rerun-wait.outputs.checks == 'green'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.review-timeout-minutes) }}
    # One Review per PR at a time.
    concurrency:
      group: fabrik-review-${{ needs.kit.outputs.pull-request }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      pull-requests: read
      # To download a UI PR's UI evidence from the Implement run that captured it.
      actions: read
    outputs:
      # Read by the push job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
      # For its Run record: the model and effort the runner passed, and the commit the run started from.
      model: ${{ steps.agent.outputs.model }}
      effort: ${{ steps.agent.outputs.effort }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Check out the PR's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          ref: ${{ needs.review-checks.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      # Before the secrets load, so a run whose agent never started still names it.
      - name: Note the commit the run starts from
        id: base
        run: echo "sha=$(git -C product rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # The PR, its Ticket and the Ticket's Spec, and the Operator's comments on the PR;
      # never its other comments, so earlier Verdicts don't steer it.
      - name: Prepare the agent job
        uses: ./kit/.github/actions/prepare-agent
        with:
          role: review
          github-token: ${{ github.token }}
          issue: ${{ needs.kit.outputs.ticket }}
          pull-request: ${{ needs.kit.outputs.pull-request }}

      # A UI PR's UI evidence (#153): the screenshots and capture result its marker
      # names, from the Implement run that kept them, read as data and never run.
      # Outside the working directory: the Reviewer's runner copies in the ones it
      # gets (src/agent/review.ts). continue-on-error: retention can lapse before a
      # late Review, which the Reviewer then hears as capture having left no result.
      - name: Download the UI evidence
        if: needs.kit.outputs.ui-evidence-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.kit.outputs.ui-evidence-run }}
          artifact-ids: ${{ needs.kit.outputs.ui-evidence-artifact }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fabrik-ui-evidence

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/${{ needs.kit.outputs.subscription }}/credential

      - name: Run the Reviewer
        id: agent
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_SPEC_FILE: ${{ runner.temp }}/spec.json
          FABRIK_PULL_REQUEST_FILE: ${{ runner.temp }}/pull-request.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_MODEL: ${{ needs.kit.outputs.model }}
          FABRIK_EFFORT: ${{ needs.kit.outputs.effort }}
          # Only on a UI PR: where its UI evidence was downloaded, whether or not that worked,
          # and why its capture failed, for when the download holds no capture result to read.
          FABRIK_UI_EVIDENCE_DIR: ${{ needs.kit.outputs.ui-evidence-run != '' && format('{0}/fabrik-ui-evidence', runner.temp) || '' }}
          FABRIK_UI_EVIDENCE_FAILURE: ${{ needs.kit.outputs.ui-evidence-failure }}
          # The Required checks that passed on this head only by being skipped or reporting neutral (#456), from the wait that went green.
          FABRIK_RAN_NOTHING: ${{ needs.rerun-wait.outputs.checks == 'green' && needs.rerun-wait.outputs.ran-nothing || needs.review-checks.outputs.ran-nothing }}
        run: node ../kit/src/agent/run.ts review

      - name: Pass the Verdict to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/fabrik-out/agent-result.json
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure, a reply with no
      # valid Verdict line included. A run cancelled by its timeout leaves none.
      - name: Pass the failure report to the push job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

      # The agent's stream-json transcript (src/agent/transcript.ts), written line by
      # line as it ran, so it's kept when the run passed, failed or timed out. Not
      # fabrik-agent-*: the push job downloads those and reads none as a timeout.
      # continue-on-error: keeping it must never fail a run that passed.
      - name: Gzip the agent's transcript
        if: always()
        continue-on-error: true
        run: if [ -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl" ]; then gzip -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl"; fi

      - name: Keep the agent's transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-transcript-review
          path: ${{ runner.temp }}/fabrik-out/transcript.jsonl.gz
          if-no-files-found: ignore
          retention-days: 7

  # The Digest writer (ADR-0022). Read-only, shaped as the Reviewer's job is
  # (ADR-0002): a checkout of the PR at the head its pass was given on, with
  # its history, no GitHub credential for the agent, and only the agent service
  # account. It gets the Base skills alone, runs none of the PR's code, and
  # passes its reply out as an artifact for the push job, which renders and
  # posts the Digest, or the no-Digest line when this job fails or runs past
  # its time limit. agent:digest stays on the PR until then: no claim job
  # takes it off.
  # Named "Digest PR #<agent PR>", as the Review job is named for its own
  # (DIGEST_JOB_NAME in src/github/snapshot.ts).
  digest:
    name: "Digest PR #${{ needs.kit.outputs.pull-request }}"
    needs: kit
    if: needs.kit.outputs.route == 'digest'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.digest-timeout-minutes) }}
    # One Digest run per PR at a time.
    concurrency:
      group: fabrik-digest-${{ needs.kit.outputs.pull-request }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      # Read by the push job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
      # For its Run record: the model and effort the runner passed, and the commit the run started from.
      model: ${{ steps.agent.outputs.model }}
      effort: ${{ steps.agent.outputs.effort }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Check out the PR at the head its pass was given on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          ref: ${{ needs.kit.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      # Before the secrets load, so a run whose agent never started still names it.
      - name: Note the commit the run starts from
        id: base
        run: echo "sha=$(git -C product rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # The Ticket and its Spec, and the PR as the Digest writer is given it: its title and body, the
      # Operator's Request changes and comments, every Verdict, the Kit's own notes and whether UI
      # evidence exists. No transcript and no Run record.
      - name: Prepare the agent job
        uses: ./kit/.github/actions/prepare-agent
        with:
          role: digest
          github-token: ${{ github.token }}
          issue: ${{ needs.kit.outputs.ticket }}
          pull-request: ${{ needs.kit.outputs.pull-request }}

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/${{ needs.kit.outputs.subscription }}/credential

      - name: Run the Digest writer
        id: agent
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_SPEC_FILE: ${{ runner.temp }}/spec.json
          FABRIK_PULL_REQUEST_FILE: ${{ runner.temp }}/pull-request.json
          # The head the Kit job's plan started the run at, which the Digest is written as of.
          FABRIK_HEAD_SHA: ${{ needs.kit.outputs.head-sha }}
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_MODEL: ${{ needs.kit.outputs.model }}
          FABRIK_EFFORT: ${{ needs.kit.outputs.effort }}
        run: node ../kit/src/agent/run.ts digest

      - name: Pass the reply to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/fabrik-out/agent-result.json
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure, a reply that
      # breaks its shape included. A run cancelled by its time limit leaves none.
      - name: Pass the failure report to the push job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

      # The agent's stream-json transcript (src/agent/transcript.ts), written line by
      # line as it ran, so it's kept when the run passed, failed or timed out. Not
      # fabrik-agent-*: the push job downloads those and reads none as a timeout.
      # continue-on-error: keeping it must never fail a run that passed.
      - name: Gzip the agent's transcript
        if: always()
        continue-on-error: true
        run: if [ -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl" ]; then gzip -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl"; fi

      - name: Keep the agent's transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-transcript-digest
          path: ${{ runner.temp }}/fabrik-out/transcript.jsonl.gz
          if-no-files-found: ignore
          retention-days: 7

  # The Auditor (#150). Read-only, like the Reviewer: a checkout of the default
  # branch at the pending Audit's marked commit, with its full history for git
  # log and blame, no GitHub write credential, and only the agent service
  # account. It gets the Base skills alone, runs none of the code, and passes
  # its Audit out as an artifact for the push job to fill in.
  audit:
    name: Audit
    needs: kit
    if: needs.kit.outputs.route == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.audit-timeout-minutes) }}
    # One Auditor run per repo at a time.
    concurrency:
      group: fabrik-audit
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      # Read by the push job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
      # For its Run record: the model and effort the runner passed, and the commit the run started from.
      model: ${{ steps.agent.outputs.model }}
      effort: ${{ steps.agent.outputs.effort }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Check out the default branch at the Audit's marked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          ref: ${{ needs.kit.outputs.audit-commit }}
          fetch-depth: 0
          persist-credentials: false

      # Before the secrets load, so a run whose agent never started still names it.
      - name: Note the commit the run starts from
        id: base
        run: echo "sha=$(git -C product rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # The pending Audit, and its inputs in audit.json: the hot-spot window, the
      # agent PRs merged in it, comprehension drift, the last closed Audits with
      # the Operator's comments, and the open issues filed from Audits.
      - name: Prepare the agent job
        uses: ./kit/.github/actions/prepare-agent
        with:
          role: audit
          github-token: ${{ github.token }}
          issue: ${{ github.event.issue.number }}
          audit-commit: ${{ needs.kit.outputs.audit-commit }}

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/${{ needs.kit.outputs.subscription }}/credential

      - name: Run the Auditor
        id: agent
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_AUDIT_FILE: ${{ runner.temp }}/audit.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_MODEL: ${{ needs.kit.outputs.model }}
          FABRIK_EFFORT: ${{ needs.kit.outputs.effort }}
        run: node ../kit/src/agent/run.ts audit

      - name: Pass the Audit output to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: ${{ runner.temp }}/fabrik-out/agent-result.json
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure, a reply that
      # breaks the Audit contract included. A run cancelled by its timeout leaves none.
      - name: Pass the failure report to the push job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: ${{ runner.temp }}/fabrik-out/agent-failure.json
          if-no-files-found: ignore
          retention-days: 7

      # The agent's stream-json transcript (src/agent/transcript.ts), written line by
      # line as it ran, so it's kept when the run passed, failed or timed out. Not
      # fabrik-agent-*: the push job downloads those and reads none as a timeout.
      # continue-on-error: keeping it must never fail a run that passed.
      - name: Gzip the agent's transcript
        if: always()
        continue-on-error: true
        run: if [ -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl" ]; then gzip -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl"; fi

      - name: Keep the agent's transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-transcript-audit
          path: ${{ runner.temp }}/fabrik-out/transcript.jsonl.gz
          if-no-files-found: ignore
          retention-days: 7

  # A Retro run's first job (#151), which gathers the pending Retro's evidence
  # from this repo's paths in fabrik-runs and its GitHub facts. Shaped like the
  # push job (ADR-0009's addendum): it checks out only the Kit, runs no agent
  # and no Product code, and through the push service account mints only
  # read-only Fabrik App tokens, Contents read on fabrik-runs among them. It
  # passes the evidence out as fabrik-retro-evidence, for the Retro job and
  # the push job. When it fails, the push job fails the Retro.
  retro-evidence:
    name: Retro evidence
    needs: kit
    if: needs.kit.outputs.route == 'retro'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.retro-timeout-minutes) }}
    permissions: {}
    outputs:
      # Read by the push job: a failed 1Password step means the evidence was never gathered.
      secrets-step: ${{ steps.evidence.outputs.secrets-step }}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Gather the Retro's evidence
        id: evidence
        uses: ./kit/.github/actions/gather-retro-evidence
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}

  # The Retro (#151), a Retro run's second job. Read-only, like the Auditor: a
  # checkout of the default branch, no GitHub write credential, and only the
  # agent service account. It gets the Base skills alone, runs none of the
  # code, reads the evidence job's bundle, and passes its proposals out as an
  # artifact for the push job to fill the Retro in with.
  retro:
    name: Retro
    needs: [kit, retro-evidence]
    if: needs.kit.outputs.route == 'retro'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.retro-timeout-minutes) }}
    # One Retro run per repo at a time.
    concurrency:
      group: fabrik-retro
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      # Read by the push job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.retro.outputs.secrets-step }}
      # For its Run record: the model and effort the runner passed, and the commit the run started from.
      model: ${{ steps.retro.outputs.model }}
      effort: ${{ steps.retro.outputs.effort }}
      base-sha: ${{ steps.retro.outputs.base-sha }}
    steps:
      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # Checks out the default branch, takes the evidence and runs the Retro;
      # it leaves fabrik-agent-result or fabrik-agent-failure, and always keeps
      # fabrik-transcript-retro for the Run record.
      - name: Run the Retro
        id: retro
        uses: ./kit/.github/actions/run-retro
        with:
          op-agent-token: ${{ secrets.OP_AGENT_TOKEN }}
          github-token: ${{ github.token }}
          # The Subscription whose Claude token the Retro runs on, chosen by the Kit job.
          subscription: ${{ needs.kit.outputs.subscription }}
          model: ${{ needs.kit.outputs.model }}
          effort: ${{ needs.kit.outputs.effort }}

  # The Researcher (#154). Read-only, like the Auditor: a checkout of the
  # default branch, no GitHub write credential, and only the agent service
  # account. It gets the Base skills alone and runs none of the code. The
  # runner cuts the research Decision's throwaway branch, commits the findings
  # file the agent wrote to it as the Fabrik Researcher, and passes it out as a
  # bundle beside its result, as the Implement job does, for the push job to
  # land. Named as Dispatch counts Research runs by (RESEARCH_JOB_NAME in src/github/snapshot.ts).
  research:
    name: Research
    needs: kit
    if: needs.kit.outputs.route == 'research'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.research-timeout-minutes) }}
    # One Researcher run per Decision at a time, so two never race on one branch.
    concurrency:
      group: fabrik-research-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
    outputs:
      # Read by the push job: a failed 1Password step means the agent never started.
      secrets-step: ${{ steps.op.outcome }}
      # For its Run record: the model and effort the runner passed, and the commit the run started from.
      model: ${{ steps.agent.outputs.model }}
      effort: ${{ steps.agent.outputs.effort }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      # A fresh clone, with the history the bundle of the Decision's branch is cut from.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # Before the secrets load, so a run whose agent never started still names it.
      - name: Note the commit the run starts from
        id: base
        run: echo "sha=$(git -C product rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # The research Decision, and its Map as the issue's parent in spec.json.
      - name: Prepare the agent job
        uses: ./kit/.github/actions/prepare-agent
        with:
          role: research
          github-token: ${{ github.token }}
          issue: ${{ github.event.issue.number }}

      - name: Load the Claude token
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_AGENT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Fabrik/${{ needs.kit.outputs.subscription }}/credential

      - name: Run the Researcher
        id: agent
        working-directory: product
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRIK_ISSUE_FILE: ${{ runner.temp }}/issue.json
          FABRIK_SPEC_FILE: ${{ runner.temp }}/spec.json
          FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
          FABRIK_MODEL: ${{ needs.kit.outputs.model }}
          FABRIK_EFFORT: ${{ needs.kit.outputs.effort }}
        run: node ../kit/src/agent/run.ts research

      # The result and the bundle of the Decision's branch (none if the run wrote nothing).
      - name: Pass the Researcher's output and findings to the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-result
          path: |
            ${{ runner.temp }}/fabrik-out/agent-result.json
            ${{ runner.temp }}/fabrik-out/agent-branch.bundle
          if-no-files-found: error
          retention-days: 7

      # src/agent/run.ts writes this when it catches a failure, a reply that
      # breaks the research contract included. A run cancelled by its timeout leaves none.
      # With it, the bundle of any commits the run made before it failed
      # (#431): never pushed, kept for the Operator, as the notice says.
      - name: Pass the failure report to the push job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-agent-failure
          path: |
            ${{ runner.temp }}/fabrik-out/agent-failure.json
            ${{ runner.temp }}/fabrik-out/agent-branch.bundle
          if-no-files-found: ignore
          retention-days: 7

      # The agent's stream-json transcript (src/agent/transcript.ts), written line by
      # line as it ran, so it's kept when the run passed, failed or timed out. Not
      # fabrik-agent-*: the push job downloads those and reads none as a timeout.
      # continue-on-error: keeping it must never fail a run that passed.
      - name: Gzip the agent's transcript
        if: always()
        continue-on-error: true
        run: if [ -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl" ]; then gzip -f "$RUNNER_TEMP/fabrik-out/transcript.jsonl"; fi

      - name: Keep the agent's transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabrik-transcript-research
          path: ${{ runner.temp }}/fabrik-out/transcript.jsonl.gz
          if-no-files-found: ignore
          retention-days: 7

  # A replay Ticket's Implement run (#156), one matrix leg per arm: the
  # baseline, as the Ticket was built then, and the variant, with the one
  # variable changed. It has the Implement job's shape and credentials
  # (ADR-0002, ADR-0004): contents, issues and pull requests read, no GitHub
  # write credential, and only the implement service account, which its action
  # loads the Claude token and the test secrets through. Its action checks out
  # the Ticket's baseSha and passes the arm's commits out as a patch, never
  # pushed. Never named `Implement`, so Dispatch's count of Implement runs in
  # flight passes both arms by (IMPLEMENT_JOB_NAME in src/github/snapshot.ts).
  # It runs only on the Ticket this run's claim marked in progress, and not at all
  # when the Kit job couldn't lay the variant's candidate Kit sha (#449), so the
  # baseline spends no run beside a variant that can't run; nor do the jobs after it.
  replay-implement:
    name: "Replay implement (${{ matrix.arm }})"
    needs: [kit, implement-claim]
    if: needs.kit.outputs.route == 'replay' && needs.implement-claim.outputs.replay-ticket == needs.kit.outputs.ticket && needs.kit.outputs.replay-kit-sha-unavailable == ''
    runs-on: ubuntu-latest
    # The Implement role's own timeout: a replay arm captures no UI evidence after it.
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.implement-timeout-minutes) }}
    # Both arms run, whatever the other comes to: the replay-record job lands each.
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, variant]
    # pull-requests: read for the input step, as the design job's: on a Ticket
    # sent back from an agent PR, it reads that closed PR into issue.json's
    # sentBack (readSentBack in src/agent/inputs.ts). Without it the arm fails
    # before its agent starts (#340).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # It leaves its result, patch and account of the run, and its transcript, as artifacts carrying the arm.
      - name: Run the arm's Implementer
        uses: ./kit/.github/actions/replay-implement
        with:
          arm: ${{ matrix.arm }}
          op-implement-token: ${{ secrets.OP_IMPLEMENT_TOKEN }}
          github-token: ${{ github.token }}
          ticket: ${{ needs.kit.outputs.ticket }}
          base-sha: ${{ needs.kit.outputs.base-sha }}
          replay-arms: ${{ needs.kit.outputs.replay-arms }}
          subscription: ${{ needs.kit.outputs.subscription }}

  # A replay arm's gates (#156): the Sandbox's setup, build and tests from Kit
  # config at the Ticket's baseSha on the arm's patch, then the merged PR's
  # hidden tests. It runs the arm's code, so it holds no write credential
  # (ADR-0002): contents and pull requests read, and only the implement
  # service account, for the test secrets, with no Claude token. It runs once
  # the arm's Implement job has ended, whatever it came to: its action runs
  # nothing for an arm that left no patch it can lay, and says why.
  replay-gates:
    name: "Replay gates (${{ matrix.arm }})"
    needs: [kit, implement-claim, replay-implement]
    if: ${{ !cancelled() && needs.kit.outputs.route == 'replay' && needs.implement-claim.outputs.replay-ticket == needs.kit.outputs.ticket && needs.kit.outputs.replay-kit-sha-unavailable == '' }}
    runs-on: ubuntu-latest
    # Kit config has no gates timeout; they run what an Implement run's checks would.
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.implement-timeout-minutes) }}
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, variant]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Run the arm's gates
        uses: ./kit/.github/actions/replay-gates
        with:
          arm: ${{ matrix.arm }}
          op-implement-token: ${{ secrets.OP_IMPLEMENT_TOKEN }}
          github-token: ${{ github.token }}
          ticket: ${{ needs.kit.outputs.ticket }}
          pull-request: ${{ needs.kit.outputs.pull-request }}
          base-sha: ${{ needs.kit.outputs.base-sha }}

  # A replay arm's Review (#156): the Reviewer on the arm's diff from the
  # Ticket's baseSha, against the Ticket and its Spec, with no PR. It has the
  # Review job's shape and credentials: read-only, no GitHub write
  # credential, and only the agent service account. It runs whether or not
  # the arm's gates passed, so every arm gets a Verdict.
  replay-review:
    name: "Replay review (${{ matrix.arm }})"
    needs: [kit, implement-claim, replay-implement]
    if: ${{ !cancelled() && needs.kit.outputs.route == 'replay' && needs.implement-claim.outputs.replay-ticket == needs.kit.outputs.ticket && needs.kit.outputs.replay-kit-sha-unavailable == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.review-timeout-minutes) }}
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, variant]
    # pull-requests: read for the input step, as replay-implement's: a sent-back
    # Ticket's closed PR is read into issue.json's sentBack (#340).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out the Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Run the arm's Reviewer
        uses: ./kit/.github/actions/replay-review
        with:
          arm: ${{ matrix.arm }}
          op-agent-token: ${{ secrets.OP_AGENT_TOKEN }}
          github-token: ${{ github.token }}
          ticket: ${{ needs.kit.outputs.ticket }}
          base-sha: ${{ needs.kit.outputs.base-sha }}
          replay-arms: ${{ needs.kit.outputs.replay-arms }}
          subscription: ${{ needs.kit.outputs.subscription }}

  # A replay arm's judge (#156): the scoring plan, which picks every replay
  # Implement run it doesn't skip, then the existing judge on the arm's
  # transcript, at the pinned release's rubrics, from this Kit checkout. Like
  # the judge job, it holds no write credential: it reads the Ticket, and
  # loads only the Claude token, through the agent service account. Never
  # named like the Implement job.
  replay-score:
    name: "Replay score (${{ matrix.arm }})"
    needs: [kit, implement-claim, replay-implement]
    if: ${{ !cancelled() && needs.kit.outputs.route == 'replay' && needs.implement-claim.outputs.replay-ticket == needs.kit.outputs.ticket && needs.kit.outputs.replay-kit-sha-unavailable == '' }}
    runs-on: ubuntu-latest
    # The Kit's, not Kit config's: JUDGE_TIMEOUT_MINUTES in src/kit/runStore.ts (a test holds the two together).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, variant]
    permissions:
      # Only to read the Ticket the scored run built.
      issues: read
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Score the arm's Implement run
        uses: ./kit/.github/actions/replay-score
        with:
          arm: ${{ matrix.arm }}
          kit-outputs: ${{ toJSON(needs.kit.outputs) }}
          op-agent-token: ${{ secrets.OP_AGENT_TOKEN }}
          github-token: ${{ github.token }}

  # The replay's own push job (ADR-0009's addendum), once for both arms: it
  # checks out only the Kit, runs no agent and no Product code, and through
  # the push service account mints a store token, for fabrik-runs alone with
  # Contents write, and the Fabrik App's token, for the replay issue. It
  # writes each arm's patch, Run records, transcripts and judge's record and
  # score file to the store, each create-only, then lands the run on the
  # replay issue through the Loop. always(), so it runs once both arms' jobs
  # have ended, whatever they came to and even when the run was cancelled: an
  # arm that left no account of its run lands as an Infrastructure failure. A
  # run this job can't land at all, the scheduled tick releases once its
  # Ticket is in progress past the longest a run can last
  # (src/loop/replayGate.ts). continue-on-error, so it never fails the run.
  replay-record:
    name: Replay record
    needs: [kit, implement-claim, replay-implement, replay-gates, replay-review, replay-score]
    if: always() && needs.kit.outputs.route == 'replay' && needs.implement-claim.outputs.replay-ticket == needs.kit.outputs.ticket
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Write the replay's records and land the run
        uses: ./kit/.github/actions/replay-record
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}
          kit-outputs: ${{ toJSON(needs.kit.outputs) }}

  # The push job, after whichever agent job the Kit job routed to, or straight
  # after the Kit job when it routed here. What it applies, src/main.ts decides
  # from how those jobs ended (src/kit/pushJob.ts): the agent job's result (for
  # an Implement run, after the trust-root guard on its branch; for a prototype
  # turn, after the trust-root guard, as a fast-forward of prototype/<issue>;
  # for a Research run, once its branch changes only its findings file), a
  # Review's red checks or Verdict, a Digest run's Digest, or, when the agent
  # job failed or was cancelled (its timeout-minutes included), the failure
  # notice, which for a Digest run is its no-Digest line. always(), so
  # it still runs after a cancelled agent job. Never on a replay, whose
  # replay-record job is its push job, so the judge, score-record, Dispatch
  # and Design queue jobs, which follow this one, skip a replay too.
  push:
    name: Push
    needs: [kit, triage, design, prototype, implement, review-checks, rerun-checks, rerun-wait, review, digest, audit, retro-evidence, retro, research]
    if: always() && needs.kit.result == 'success' && needs.kit.outputs.route != 'none' && needs.kit.outputs.route != 'replay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A push to the default branch runs the conflict check, as the scheduled tick does: it takes turns with
    # the tick and with the next push's check, queueing, so two never note the same Request changes (#341).
    # Every other push job runs at once.
    concurrency:
      group: ${{ github.event_name == 'push' && 'fabrik-tick' || format('fabrik-push-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    permissions:
      # Only for a push to the default branch's conflict check, which reads whether an Implement job is under way
      # before restarting a stalled Request-changes run (#387); the Fabrik App has no Actions permission.
      actions: read
    outputs:
      # "true" when the plan asked for a Dispatch check.
      dispatch: ${{ steps.loop.outputs.dispatch }}
      # "true" when the plan asked for a Design queue check.
      design-queue: ${{ steps.loop.outputs.design-queue }}
      # "true" when the scoring plan picked the run for the judge job (#149), the
      # path of the scored run's Run record in the store, for the score-record job,
      # and the run's kind, as JSON, for the judge (#450).
      score: ${{ steps.record.outputs.score }}
      record: ${{ steps.record.outputs.record }}
      scored-run: ${{ steps.record.outputs.scored-run }}
    env:
      # How each job ended and what it passed out, none of which the agent can rewrite.
      FABRIK_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # Whatever the agent job left: its result (and bundle), or its failure report,
      # or the Review checks job's failure report. Red checks and a timeout leave
      # nothing, and src/main.ts expects that.
      - name: Take the agent job's artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fabrik-agent-*
          merge-multiple: true
          path: ${{ runner.temp }}/agent

      # A Retro run's evidence, which src/main.ts reads the refs and the streak
      # table the Kit checks the proposals against from, never from the agent's
      # result. A failed evidence job leaves none, and its failure needs none.
      - name: Take the Retro's evidence
        if: needs.kit.outputs.route == 'retro'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fabrik-retro-evidence
          path: ${{ runner.temp }}/retro-evidence

      - name: Run the Loop
        id: loop
        uses: ./kit/.github/actions/run-loop
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}
          actions-token: ${{ github.event_name == 'push' && github.token || '' }}

      # A UI PR's preview deployment (#153): when the plan pushed a UI PR whose
      # Kit config declares preview.url, polls the URL it filled in, for a few
      # minutes at most (src/kit/previewLink.ts), and links it in the PR's
      # evidence section, or says it never answered. continue-on-error, and a
      # timeout of its own inside the job's, so a slow or broken host never
      # fails the push job, and the Run record step still runs.
      - name: Link the preview deployment
        if: steps.loop.outputs.preview-url != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: ./kit/.github/actions/link-preview
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}
          url: ${{ steps.loop.outputs.preview-url }}
          pull-request: ${{ steps.loop.outputs.preview-pull-request }}

      # A prototype round's preview (#155), as a UI PR's: when the plan pushed
      # prototype/<issue> and posted its round, with Kit config declaring a
      # preview.url that names no PR, polls the route's page it filled in, for
      # a few minutes at most, and links it beside each variant, or says in the
      # round it never answered. One plan lands one run, so it and the step
      # above never both poll. continue-on-error, and a timeout of its own, as
      # above; its token can edit issues, as the round is an issue comment.
      - name: Link the prototype's previews
        if: steps.loop.outputs.prototype-preview-url != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: ./kit/.github/actions/link-prototype-preview
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}
          url: ${{ steps.loop.outputs.prototype-preview-url }}
          round: ${{ steps.loop.outputs.prototype-preview-round }}

      # The run's Run record and transcript, to the fabrik-runs store (ADR-0009).
      # always(), so a Loop that failed still leaves its record; continue-on-error,
      # so a store problem never fails the push job or stalls the Loop. Without
      # fabrik-runs it writes one step-summary line naming the setup step. For a
      # record in the store it then runs the scoring plan (#149): it writes a
      # skip's score file itself, and asks the judge job for a score.
      - name: Write the Run record
        id: record
        if: always()
        continue-on-error: true
        uses: ./kit/.github/actions/write-run-record
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}
          role: ${{ needs.kit.outputs.route }}
          empty-diff: ${{ steps.loop.outputs.empty-diff }}

  # Dispatch (ADR-0001): runs when the push job's plan asked for a check, on a
  # fresh snapshot taken after that plan's labels landed. Like the push job, it
  # never checks out or runs Product code.
  dispatch:
    name: Dispatch
    needs: [kit, push]
    if: ${{ !cancelled() && needs.push.result == 'success' && needs.push.outputs.dispatch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.kit.outputs.dispatch-timeout-minutes) }}
    # One check at a time, so two can't both fill the same free slot. A newer
    # pending check replacing an older one is fine: each reads fresh state.
    concurrency:
      group: fabrik-dispatch
      cancel-in-progress: false
    permissions:
      # Only to count Implement and Research runs in flight; the Fabrik App has no Actions permission.
      actions: read
    env:
      FABRIK_DISPATCH_CHECK: "true"
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # The App token adds agent:implement or agent:research, so the label starts the Implement or Research run.
      - name: Run a Dispatch check
        uses: ./kit/.github/actions/run-loop
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}
          actions-token: ${{ github.token }}

  # The Design queue check (#147): runs when the push job's plan asked for a
  # check, on a fresh snapshot taken after that plan landed. It adds
  # agent:design to the waiting needs-design issues it starts. Like the push
  # job, it never checks out or runs Product code.
  design-queue:
    name: Design queue
    needs: [kit, push]
    if: ${{ !cancelled() && needs.push.result == 'success' && needs.push.outputs.design-queue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One check at a time per repo, so two can't both fill the same free slot.
    # A newer pending check replacing an older one is fine: each reads fresh state.
    concurrency:
      group: fabrik-design-queue
      cancel-in-progress: false
    permissions:
      # Only to read Design-session turns in progress; the Fabrik App has no Actions permission.
      actions: read
    env:
      FABRIK_DESIGN_QUEUE_CHECK: "true"
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # The App token adds agent:design, so the label starts the Design-session turn.
      - name: Run a Design queue check
        uses: ./kit/.github/actions/run-loop
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}
          actions-token: ${{ github.token }}

  # The judge (#149): scores the Implement run the push job just recorded, when
  # the push job's scoring plan picked it, from the run's transcript and its
  # Ticket, with the Kit's fixed judge model and no tools. Like an agent job,
  # it holds no write credential (ADR-0002): it checks out only the Kit, reads
  # the Ticket with the read-only token, and loads only the Claude token,
  # through the agent service account (ADR-0004). It runs after the push job,
  # beside Dispatch and the Design queue check, so it never blocks or delays
  # the Loop. Never named like the Implement job, so Dispatch's count of
  # Implement runs in flight passes it by. Its key is JUDGE_JOB in src/kit/judge.ts.
  score:
    name: Score
    needs: [kit, push]
    if: ${{ !cancelled() && needs.push.outputs.score == 'true' }}
    runs-on: ubuntu-latest
    # The Kit's, not Kit config's: JUDGE_TIMEOUT_MINUTES in src/kit/runStore.ts (a test holds the two together).
    timeout-minutes: 15
    permissions:
      # Only to read the Ticket the scored run built.
      issues: read
    outputs:
      # For the judge's Run record, as an agent job passes out its own: a failed
      # 1Password step means the judge never started.
      secrets-step: ${{ steps.judge.outputs.secrets-step }}
      model: ${{ steps.judge.outputs.model }}
      effort: ${{ steps.judge.outputs.effort }}
      # The attempt the judge ran in: a judge re-run after a failed one gets a
      # Run record of its own, under this attempt, so what both cost counts.
      attempt: ${{ github.run_attempt }}
    steps:
      # The run-judge action checks nothing out, so this is all the job has.
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Run the judge
        id: judge
        uses: ./kit/.github/actions/run-judge
        with:
          op-agent-token: ${{ secrets.OP_AGENT_TOKEN }}
          github-token: ${{ github.token }}
          ticket: ${{ needs.kit.outputs.ticket }}
          # The scored run's kind, from its Run record, so it's judged against what it was asked (#450).
          scored-run: ${{ needs.push.outputs.scored-run }}
          # The scored Implement run's Subscription, chosen by this Loop run's Kit job.
          subscription: ${{ needs.kit.outputs.subscription }}
          # With rotation on, the judge is killed on overage, as an agent run is.
          rotation: ${{ needs.kit.outputs.rotation }}

  # The judge run's own push job (ADR-0009's addendum): it writes the judge's
  # transcript, its Run record (role `score`) and the score file to fabrik-runs.
  # It runs after the judge job whether that succeeded or failed, so a failed
  # judge still leaves its record and a judge-failed score file, unless the run
  # was cancelled. continue-on-error, so writing the score never fails the run;
  # a judge that fails does, as the Score job has none, so the run shows red.
  score-record:
    name: Score record
    needs: [kit, push, score]
    if: ${{ !cancelled() && needs.score.result != 'skipped' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      # How the judge job ended and what it passed out (the `score` entry), and the
      # Kit job's sha, none of which the judge can rewrite.
      FABRIK_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # Mints a token for fabrik-runs alone, with Contents write, through the push service account.
      - name: Write the score record
        uses: ./kit/.github/actions/write-score-record
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}
          record: ${{ needs.push.outputs.record }}
