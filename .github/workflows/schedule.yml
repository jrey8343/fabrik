# The Fabrik Loop's scheduled tick, called from a Product repo's
# .github/workflows/fabrik.yml on its schedule.
#
# This file is wiring only. It runs the Loop's time-based rules (closing the
# weekly-limit issue after its reset, opening the week's pending Audit and
# pending Retro, taking the Replays' next step, and a Design queue check)
# through the Loop rules core, which src/main.ts runs as a `scheduled-tick`
# event, once a week the Product repo's skills bumps for its own Skills
# sources, and every hour the Monitor, in a job of its own. The Fabrik App
# opening the pending Audit or Retro starts the Loop workflow, whose Audit job
# runs the Auditor and whose Retro evidence and Retro jobs run the Retro, and
# its adding agent:replay to a replay issue starts that workflow's replay jobs
# (#156), so the tick itself holds only the push service account.
#
# Like the Loop's push job (ADR-0002), the tick, skills bump and Monitor jobs
# run on a fresh VM, load the Fabrik App key through the push service account,
# mint an App token, and never check out or run Product code. They check out
# only Fabrik itself, at the exact commit the caller pinned.
name: Fabrik scheduled tick

on:
  workflow_call:
    secrets:
      OP_PUSH_TOKEN:
        description: The Product repo's read-only 1Password push service account, which reads the Fabrik App vault.
        required: true

permissions: {}

jobs:
  kit:
    name: Kit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only to read this workflow's own commit from the job's OIDC token.
      id-token: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      started-at: ${{ steps.kit.outputs.started-at }}
    steps:
      # No expression context names a called workflow's ref or commit, so read
      # them from the OIDC token's job_workflow_ref and job_workflow_sha claims.
      - name: Read the Kit's workflow ref from the OIDC token
        id: kit
        run: |
          set -euo pipefail
          jwt="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r .value)"
          claims="$(node -e 'process.stdout.write(Buffer.from(process.argv[1].split(".")[1], "base64url").toString())' "$jwt")"
          ref="$(jq -r .job_workflow_ref <<<"$claims")"
          sha="$(jq -r .job_workflow_sha <<<"$claims")"
          case "$ref" in
            jrey8343/fabrik/.github/workflows/schedule.yml@*) ;;
            *) echo "::error::Unexpected Kit workflow ref: $ref"; exit 1 ;;
          esac
          echo "workflow-ref=$ref" >>"$GITHUB_OUTPUT"
          echo "workflow-sha=$sha" >>"$GITHUB_OUTPUT"
          # When the run got going, for the weekly skills bump gate.
          echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ steps.kit.outputs.workflow-sha }}
          path: kit
          persist-credentials: false

      # A pinned annotated tag's claim names the tag object, not its commit. The checkout
      # peels it, so pass out the commit it landed on: every job checks the Kit out at it,
      # and every Run record names it as its kitSha (#324).
      - name: Peel the Kit's pinned commit
        id: commit
        env:
          KIT_REF: ${{ steps.kit.outputs.workflow-ref }}
        run: |
          set -euo pipefail
          sha="$(git -C kit rev-parse HEAD)"
          echo "Kit: $KIT_REF at commit $sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  tick:
    name: Tick
    needs: kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One tick at a time per repo; a tick that's queued behind another waits. loop.yml's push job on a push
    # to the default branch shares the group, so its conflict check and the tick's take turns (#341).
    concurrency:
      group: fabrik-tick
      cancel-in-progress: false
      queue: max
    permissions: {}
    outputs:
      # "true" when the plan asked for a Design queue check.
      design-queue: ${{ steps.loop.outputs.design-queue }}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # While a replay issue is open (#156), the Run records the replay step reads, from a
      # read-only checkout of fabrik-runs; with none open it reads nothing of the store. A
      # store that isn't there or can't be read never fails the tick: the replay step then
      # starts no replay Ticket.
      - name: Check out the store for the replay step
        id: replay-store
        continue-on-error: true
        uses: ./kit/.github/actions/replay-store
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}

      - name: Run the Loop's scheduled rules
        id: loop
        uses: ./kit/.github/actions/run-loop
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}
          # Whether the fabrik-runs store is ready for a Retro, which the retro gate weighs.
          find-store: "true"
          # The replay step's checkout of the store, empty when it made none.
          store-dir: ${{ steps.replay-store.outputs.store-dir }}

  # The hourly Design queue check (#147), which catches a slot freed by an
  # event the Loop doesn't watch, such as needs-design coming off by hand.
  # The caller grants this workflow no Actions permission, so it passes no
  # actions token and the check reads first turns in progress from the issues
  # (src/github/snapshot.ts).
  design-queue:
    name: Design queue
    needs: [kit, tick]
    if: ${{ !cancelled() && needs.tick.result == 'success' && needs.tick.outputs.design-queue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # loop.yml's Design queue job's group: one check at a time per repo, so two
    # can't both fill the same free slot.
    concurrency:
      group: fabrik-design-queue
      cancel-in-progress: false
    permissions: {}
    env:
      FABRIK_DESIGN_QUEUE_CHECK: "true"
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      # The App token adds agent:design, so the label starts the Design-session turn.
      - name: Run a Design queue check
        uses: ./kit/.github/actions/run-loop
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}

  # A Product repo's weekly skills bumps (src/skills/sourceBumps.ts): one PR per
  # Skills source it pins in .fabrik/skills.lock.json whose picked skills changed
  # upstream. Like the tick, it checks out only the Kit, mints a Fabrik App
  # token through the push service account, and reads and writes the Product
  # repo only through the API, never checking out or running its code. It acts
  # on the Monday tick in the 04:00 UTC hour, judged by the tick the run was
  # scheduled for, not when this job starts; a dropped tick waits a week.
  skills-bump:
    name: Skills bump
    needs: kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fabrik-skills-bump
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check this is the weekly skills bump tick
        id: due
        env:
          FABRIK_TICK_SCHEDULE: ${{ github.event.schedule }}
          FABRIK_TICK_SEEN_AT: ${{ needs.kit.outputs.started-at }}
        run: node kit/src/skills/source-bumps-due.ts

      - name: Load the Fabrik App key
        if: steps.due.outputs.due == 'true'
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        if: steps.due.outputs.due == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      # The App token, not GITHUB_TOKEN, so the bump branch it pushes starts CI.
      - name: Open or refresh the Product repo's skills bump PRs
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node kit/src/skills/source-bumps-main.ts

  # The Monitor (src/monitor/main.ts, #148): files an issue for Triage for each
  # production error Sentry reports, once monitor.errors is set, and one while
  # the default branch's CI is red, once the Fabrik App has Checks: read. It
  # reads the Product repo's Kit config, issues and check runs, and Sentry,
  # through their APIs alone: it never checks out or runs Product code, makes
  # no model call and writes no Run record. It needs only the Kit job, so it
  # runs on every tick, the weekly-limit issue open or not, and a Sentry outage
  # or a failed Monitor can't stop the tick.
  monitor:
    name: Monitor
    needs: kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fabrik-monitor
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Load the Fabrik App key
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      # No permission-* inputs: asking for Checks: read before the Operator has
      # accepted it would fail the mint. Until then red main notes it's dormant.
      - name: Mint a Fabrik App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      - name: Check whether the Kit config reads production errors
        id: config
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: node kit/src/monitor/errors-set.ts

      # Only for a repo whose Kit config sets monitor.errors. A missing or
      # unreadable item fails no job: the Monitor notes it in the step summary.
      - name: Load the Sentry token
        id: sentry
        if: steps.config.outputs.errors == 'true'
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          SENTRY_TOKEN: op://Fabrik App/Sentry token/credential

      - name: Run the Monitor
        env:
          FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
          FABRIK_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          FABRIK_SENTRY_TOKEN: ${{ steps.sentry.outputs.SENTRY_TOKEN }}
        run: node kit/src/monitor/main.ts
