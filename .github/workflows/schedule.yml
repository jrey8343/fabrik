# The Fabrik Loop's scheduled tick, called from a Product repo's
# .github/workflows/fabrik.yml on its schedule.
#
# This file is wiring only. It runs the Loop's time-based rules (closing the
# weekly-limit issue after its reset) through the Loop rules core, which
# src/main.ts runs as a `scheduled-tick` event, and once a week the Product
# repo's skills bumps for its own Skills sources.
#
# Like the Loop's push job (ADR-0002), the tick and skills bump jobs run on a
# fresh VM, load the Fabrik App key through the push service account, mint an
# App token, and never check out or run Product code. They check out only Fabrik itself, at
# the exact commit the caller pinned.
name: Fabrik scheduled tick

on:
  workflow_call:
    secrets:
      OP_PUSH_TOKEN:
        description: The Product repo's read-only 1Password push service account, which reads the Fabrik App vault.
        required: true

permissions: {}

jobs:
  kit:
    name: Kit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only to read this workflow's own commit from the job's OIDC token.
      id-token: write
    outputs:
      sha: ${{ steps.kit.outputs.sha }}
    steps:
      # No expression context names the commit of a called workflow, so read
      # it from the OIDC token's job_workflow_sha claim.
      - name: Find the Kit's pinned commit
        id: kit
        run: |
          set -euo pipefail
          jwt="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r .value)"
          claims="$(node -e 'process.stdout.write(Buffer.from(process.argv[1].split(".")[1], "base64url").toString())' "$jwt")"
          ref="$(jq -r .job_workflow_ref <<<"$claims")"
          sha="$(jq -r .job_workflow_sha <<<"$claims")"
          case "$ref" in
            jrey8343/fabrik/.github/workflows/schedule.yml@*) ;;
            *) echo "::error::Unexpected Kit workflow ref: $ref"; exit 1 ;;
          esac
          echo "Kit: $ref ($sha)"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  tick:
    name: Tick
    needs: kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One tick at a time per repo; a tick that's queued behind another waits.
    concurrency:
      group: fabrik-tick
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Run the Loop's scheduled rules
        uses: ./kit/.github/actions/run-loop
        with:
          op-push-token: ${{ secrets.OP_PUSH_TOKEN }}

  # A Product repo's weekly skills bumps (src/skills/sourceBumps.ts): one PR per
  # Skills source it pins in .fabrik/skills.lock.json whose picked skills changed
  # upstream. Like the tick, it checks out only the Kit, mints a Fabrik App
  # token through the push service account, and reads and writes the Product
  # repo only through the API, never checking out or running its code. It acts
  # on the Monday tick in the 04:00 UTC hour; a dropped tick waits a week.
  skills-bump:
    name: Skills bump
    needs: kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fabrik-skills-bump
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Check out the Kit (never the Product repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrey8343/fabrik
          ref: ${{ needs.kit.outputs.sha }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check this is the weekly skills bump tick
        id: due
        run: node kit/src/skills/source-bumps-due.ts

      - name: Load the Fabrik App key
        if: steps.due.outputs.due == 'true'
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PUSH_TOKEN }}
          FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
          FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

      - name: Mint a Fabrik App token
        if: steps.due.outputs.due == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

      # The App token, not GITHUB_TOKEN, so the bump branch it pushes starts CI.
      - name: Open or refresh the Product repo's skills bump PRs
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node kit/src/skills/source-bumps-main.ts
