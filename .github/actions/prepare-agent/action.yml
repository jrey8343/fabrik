# Readies an agent job, before any secret loads: installs the Kit's pinned
# Sandcastle and Claude Code CLI, for a Replay arm's candidate Kit sha lays
# its prompts and Base skills pin over the Kit, fetches the pinned skills (the
# Base skills plus its role's Extra skills) into the Product checkout's
# .claude/skills, and
# reads what the agent is given (the issue, its parent Spec, for Implement
# and Review runs the PR and the Operator's review, for a Digest run the PR
# with its Verdicts and the Kit's notes, for a Design-session turn
# whether it may offer a Map and the pull request its issue was filed from,
# if it was filed from one, for Triage the recent issues it compares the
# issue against for a duplicate, and for an Auditor run its inputs) into
# $RUNNER_TEMP, through the job's read-only token. The agent itself never
# gets a GitHub token.
#
# Use it after checking out the Product repo into `product/` and the Kit at
# the pinned commit into `kit/`:
#   - uses: ./kit/.github/actions/prepare-agent
#     with:
#       role: implement
name: Prepare an agent job
description: Installs the Kit, fetches the pinned skills and reads the agent's inputs.

inputs:
  role:
    description: The agent's role (triage, design, implement, review, audit, retro, research or digest), whose Extra skills it gets beside the Base skills; the Auditor, the Retro, the Researcher and the Digest writer get the Base skills alone. A Step-up run is an implement run.
    required: true
  github-token:
    description: The job's read-only GITHUB_TOKEN.
    required: true
  issue:
    description: The issue or Ticket the run is for.
    required: true
  pull-request:
    description: For a Review, a Digest run or a retry, the agent PR.
    required: false
    default: ""
  pull-request-comments:
    description: '"true" for a retry, whose PR file carries the PR''s comments (the Verdict to fix).'
    required: false
    default: "false"
  review:
    description: For a Request-changes run, the Operator's review on the PR.
    required: false
    default: ""
  audit-commit:
    description: For an Auditor run, the pending Audit's marked commit (a full SHA); its inputs go to audit.json.
    required: false
    default: ""
  kit-candidate:
    description: For a Replay arm whose variable is a candidate Kit sha, that sha; its prompts and Base skills pin, and nothing else, are laid over the Kit before the skills fetch.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install the Kit (Sandcastle and the Claude Code CLI, pinned)
      shell: bash
      working-directory: kit
      run: npm ci

    # A Replay arm's candidate Kit sha (#156): its prompts and Base skills pin,
    # and nothing else, laid over the pinned Kit, so the fetch below and the
    # agent's prompt read the candidate's while every program stays pinned
    # (ADR-0003's addendum). The sha must be a commit in the Fabrik repo, read by sha,
    # checked through the read-only token, or the job fails here.
    - name: Lay the candidate Kit sha's prompts and Base skills over the Kit
      if: inputs.kit-candidate != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FABRIK_KIT_CANDIDATE: ${{ inputs.kit-candidate }}
      run: node kit/src/kit/overlay-main.ts kit "$FABRIK_KIT_CANDIDATE"

    # The Base skills plus this role's Extra skills. An install error fails the
    # job here, before any secret loads and before claude starts.
    - name: Fetch the pinned skills into .claude/skills
      shell: bash
      env:
        FABRIK_ROLE: ${{ inputs.role }}
      run: node kit/src/skills/fetch.ts product "$FABRIK_ROLE"

    - name: Read the agent's inputs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FABRIK_ROLE: ${{ inputs.role }}
        FABRIK_ISSUE: ${{ inputs.issue }}
        FABRIK_PULL_REQUEST: ${{ inputs.pull-request }}
        FABRIK_PULL_REQUEST_COMMENTS: ${{ inputs.pull-request-comments }}
        FABRIK_REVIEW: ${{ inputs.review }}
        FABRIK_AUDIT_COMMIT: ${{ inputs.audit-commit }}
        # A failed GitHub read leaves its failure report where the agent runner
        # would, for the job's "Pass the failure report" step, so the push job's
        # notice names the request and GitHub's answer, not a crash (#328).
        FABRIK_OUT_DIR: ${{ runner.temp }}/fabrik-out
      run: node kit/src/agent/inputs.ts "$RUNNER_TEMP"
