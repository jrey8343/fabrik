# Files the week's Weekly summary in the fabrik-runs store (ADR-0009 and its
# addendum): loads the Fabrik App key through the store's push service account,
# mints two App tokens, one with Issues write and Contents read on fabrik-runs
# alone and one read-only on the Product repos, and the Loop health line's two
# (#460), each allowed to fail: one reading each repo's last Tick, one with
# Actions read counting its runs that never started or failed. Checks out only the store's
# runs/ and scores/ (its Run records and score files, never the transcripts),
# and runs src/kit/weekly-main.ts, which gathers the GitHub facts, builds the
# summary (src/kit/weeklySummary.ts) and files it (src/kit/weeklyFiling.ts).
#
# Use it after checking out the Kit at the pinned commit into `kit/`:
#   - uses: ./kit/.github/actions/file-weekly-summary
name: File the Weekly summary
description: Builds the week's Weekly summary from the store's Run records and score files and every Product repo, and files it in fabrik-runs.

inputs:
  op-push-token:
    description: The store's push service account's token (secrets.OP_PUSH_TOKEN), which reads the Fabrik App vault.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Load the Fabrik App key
      id: op
      uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
      with:
        export-env: false
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-push-token }}
        FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
        FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

    # Reads the records, the score files and the caller's time zone, and files the summary.
    - name: Mint a Fabrik App token for the fabrik-runs store
      id: store
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
        private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}
        owner: jrey8343
        repositories: fabrik-runs
        permission-contents: read
        permission-issues: write

    # Every repo in the installation, to find the Product repos and read their facts.
    - name: Mint a read-only Fabrik App token for the Product repos
      id: products
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
        private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}
        owner: jrey8343
        permission-contents: read
        permission-issues: read
        permission-pull-requests: read

    # The Loop health line's last Tick, read as the daily Tick check reads it.
    # A failed mint costs only that line's Tick, never the summary.
    - name: Mint a Fabrik App token for the Product repos' Ticks
      id: ticks
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
        private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}
        owner: jrey8343
        permission-checks: read
        permission-contents: read
        permission-issues: read

    # The Loop health line's run counts. It fails until the Operator accepts
    # the App's Actions: read, and the summary then says the counts are unread.
    - name: Mint a Fabrik App token for the Product repos' Actions runs
      id: actions
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
        private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}
        owner: jrey8343
        permission-actions: read

    - name: Check out the store's Run records and score files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: jrey8343/fabrik-runs
        token: ${{ steps.store.outputs.token }}
        path: store
        sparse-checkout: |
          runs
          scores
        sparse-checkout-cone-mode: true
        persist-credentials: false

    - name: File the Weekly summary
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        FABRIK_STORE_TOKEN: ${{ steps.store.outputs.token }}
        FABRIK_PRODUCTS_TOKEN: ${{ steps.products.outputs.token }}
        FABRIK_TICKS_TOKEN: ${{ steps.ticks.outputs.token }}
        FABRIK_ACTIONS_TOKEN: ${{ steps.actions.outputs.token }}
        FABRIK_APP_SLUG: ${{ steps.store.outputs.app-slug }}
        FABRIK_STORE_DIR: ${{ github.workspace }}/store
      run: node src/kit/weekly-main.ts
