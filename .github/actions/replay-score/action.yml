# Scores one arm's Implement run (#156) with the existing judge
# (.github/actions/run-judge), on the arm's transcript, at the pinned release's
# rubrics: the judge reads them from the Kit checkout its job made at the Kit
# job's sha, and nothing here lays a candidate Kit sha over it. First it runs
# the scoring plan on the run (src/kit/replay-plan-main.ts), which picks every
# Replay arm's Implement run but still skips one with no transcript, an
# Infrastructure failure or a reading near the weekly limit, so a skipped run
# spends no judge run (#286); the replay-record job writes a skip's score file.
# Like the judge job, it holds no write credential: only the read-only
# GITHUB_TOKEN, which reads the Ticket, and the agent service account, which
# loads the Claude token.
#
# It leaves the judge's answer or failure report and its transcript under
# names carrying the arm (run-judge's artifact-suffix), and the judge's
# account of its run, or why it never ran, as fabrik-score-replay-<arm>, for
# the replay-record job. Its job, never named like the Implement job, runs it
# once the arm's Implement job has ended, with issues read, within
# JUDGE_TIMEOUT_MINUTES, after checking out the Kit alone into kit/ at the
# Kit job's sha:
#   - uses: ./kit/.github/actions/replay-score
#     with:
#       arm: ${{ matrix.arm }}
#       kit-outputs: ${{ toJSON(needs.kit.outputs) }}
#       op-agent-token: ${{ secrets.OP_AGENT_TOKEN }}
#       github-token: ${{ github.token }}
name: Score a replay arm
description: Runs the scoring plan on one arm's Implement run, then the judge on its transcript when the plan picks it, with no write credential.

inputs:
  arm:
    description: The arm, baseline or variant (matrix.arm).
    required: true
  kit-outputs:
    description: The Kit job's outputs as one line of JSON (toJSON(needs.kit.outputs)), which name the replay Ticket's run.
    required: true
  op-agent-token:
    description: The agent service account's token (secrets.OP_AGENT_TOKEN), which reads the Claude token.
    required: true
  github-token:
    description: The job's read-only GITHUB_TOKEN, to read the Ticket.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # The arm's Implement run, each artifact into a folder named after it; a run that left none is the plan's to say.
    - name: Take the arm's Implement run
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: fabrik-*implement-replay-${{ inputs.arm }}
        path: ${{ runner.temp }}/replay

    - name: Plan whether to score the arm's Implement run
      id: plan
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        FABRIK_KIT_OUTPUTS: ${{ inputs.kit-outputs }}
        FABRIK_ARM: ${{ inputs.arm }}
        FABRIK_REPLAY_DIR: ${{ runner.temp }}/replay
      run: node src/kit/replay-plan-main.ts

    - name: Run the judge
      id: judge
      if: steps.plan.outputs.score == 'true'
      uses: ./kit/.github/actions/run-judge
      with:
        op-agent-token: ${{ inputs.op-agent-token }}
        github-token: ${{ inputs.github-token }}
        ticket: ${{ fromJSON(inputs.kit-outputs).ticket }}
        subscription: ${{ fromJSON(inputs.kit-outputs).subscription }}
        rotation: ${{ fromJSON(inputs.kit-outputs).rotation }}
        artifact-suffix: -replay-${{ inputs.arm }}

    # How the judge's run went, or why it never ran, for its Run record: the matrix's legs overwrite each other's job outputs.
    - name: Note how the arm's judge run went
      if: always()
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        FABRIK_AGENT_STEP: ${{ steps.judge.outcome }}
        FABRIK_SECRETS_STEP: ${{ steps.judge.outputs.secrets-step }}
        FABRIK_JOB_STATUS: ${{ job.status }}
        FABRIK_RAN_MODEL: ${{ steps.judge.outputs.model }}
        FABRIK_RAN_EFFORT: ${{ steps.judge.outputs.effort }}
        FABRIK_NOT_RUN: ${{ steps.plan.outputs.score != 'true' && steps.plan.outputs.why || '' }}
      run: node src/kit/replay-arm-main.ts "$RUNNER_TEMP/fabrik-score/arm-job.json"

    - name: Pass the judge's account on
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fabrik-score-replay-${{ inputs.arm }}
        path: ${{ runner.temp }}/fabrik-score/arm-job.json
        if-no-files-found: ignore
        retention-days: 7
