# Runs the Loop as the Fabrik App: loads the App key through the push service
# account, mints an App token, and runs src/main.ts, which gathers the snapshot,
# asks the Loop rules core for a plan and applies it. Every job that changes
# GitHub uses this: the push job, the claim job, the Dispatch job, the
# Design queue job, the scheduled tick and a replay's replay-record job. None
# of them checks out or runs Product code.
#
# Use it after checking out the Kit at the pinned commit into `kit/`:
#   - uses: ./kit/.github/actions/run-loop
# The job's own env carries whatever src/main.ts reads for it (FABRIK_NEEDS,
# FABRIK_DISPATCH_CHECK, FABRIK_DESIGN_QUEUE_CHECK). The scheduled tick also
# asks it to find the fabrik-runs store, which the retro gate weighs (#151),
# and hands it the store's checkout the replay step reads, when it made one
# (.github/actions/replay-store, #156).
name: Run the Loop
description: Mints a Fabrik App token and runs the Loop rules core on this run's event.

inputs:
  op-push-token:
    description: The push service account's token (secrets.OP_PUSH_TOKEN), which reads the Fabrik App vault.
    required: true
  actions-token:
    description: For the Dispatch job and loop.yml's Design queue job only, a token that can read workflow runs (its GITHUB_TOKEN); the Fabrik App has no Actions permission. The scheduled tick's Design queue job has none.
    required: false
    default: ""
  find-store:
    description: For the scheduled tick only, "true" to find whether the fabrik-runs store is ready for a Retro (#151), with a token that reads only its metadata.
    required: false
    default: "false"
  replay-run-ended:
    description: For a replay's replay-record job only (.github/actions/replay-record), the file its record step left of how the replay Ticket's run ended, which the Loop lands on the replay issue (#156).
    required: false
    default: ""
  store-dir:
    description: A checkout of the fabrik-runs store the Loop reads Run records from (src/kit/storeCheckout.ts), or empty for none, which reads as a store it can't read.
    required: false
    default: ""

outputs:
  dispatch:
    description: '"true" when the plan asked for a Dispatch check.'
    value: ${{ steps.loop.outputs.dispatch }}
  design-queue:
    description: '"true" when the plan asked for a Design queue check.'
    value: ${{ steps.loop.outputs.design-queue }}
  replay-ticket:
    description: For loop.yml's claim job on a replay, the replay Ticket the plan marked in progress in this run (#156); empty when it marked none.
    value: ${{ steps.loop.outputs.replay-ticket }}
  preview-url:
    description: For a UI PR whose Kit config declares preview.url, the preview deployment the plan asked to link, filled in for the PR as its push left it; empty otherwise.
    value: ${{ steps.loop.outputs.preview-url }}
  preview-pull-request:
    description: The PR whose preview-url to link.
    value: ${{ steps.loop.outputs.preview-pull-request }}
  prototype-preview-url:
    description: For a prototype round whose Kit config declares preview.url, the route's page on the preview the plan asked to link, filled in for the issue's prototype branch as its push left it; empty otherwise.
    value: ${{ steps.loop.outputs.prototype-preview-url }}
  prototype-preview-round:
    description: The prototype round's comment id, whose variants link prototype-preview-url.
    value: ${{ steps.loop.outputs.prototype-preview-round }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Load the Fabrik App key
      id: op
      uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
      with:
        export-env: false
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-push-token }}
        FABRIK_APP_CLIENT_ID: op://Fabrik App/Fabrik App/client-id
        FABRIK_APP_PRIVATE_KEY: op://Fabrik App/Fabrik App/private-key

    - name: Mint a Fabrik App token
      id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
        private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}

    # Asks as the App itself whether it's installed on fabrik-runs, with the
    # record action's store finder, so a store setup hasn't made yet fails no
    # step. Its key never leaves this step.
    - name: Find the fabrik-runs store
      id: find-store
      if: inputs.find-store == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        FABRIK_APP_CLIENT_ID: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
        FABRIK_APP_PRIVATE_KEY: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}
      run: node src/kit/find-store-main.ts

    # Only to read whether the store is private: a Retro never reads one others can.
    - name: Mint a token that reads the fabrik-runs store's metadata
      id: store-metadata
      if: steps.find-store.outputs.installed == 'true'
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ steps.op.outputs.FABRIK_APP_CLIENT_ID }}
        private-key: ${{ steps.op.outputs.FABRIK_APP_PRIVATE_KEY }}
        owner: jrey8343
        repositories: fabrik-runs
        permission-metadata: read

    # The App token, not GITHUB_TOKEN, so the labels it adds, the branch it
    # pushes and the PR it opens start later workflows, CI included. The App's
    # slug tells its own issues apart from any other bot's.
    - name: Run the Loop
      id: loop
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        FABRIK_APP_TOKEN: ${{ steps.app.outputs.token }}
        FABRIK_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        FABRIK_ACTIONS_TOKEN: ${{ inputs.actions-token }}
        FABRIK_STORE_METADATA_TOKEN: ${{ steps.store-metadata.outputs.token }}
        FABRIK_REPLAY_RUN_ENDED: ${{ inputs.replay-run-ended }}
        FABRIK_STORE_DIR: ${{ inputs.store-dir }}
      run: node src/main.ts
