# Writes the Run record (ADR-0009) of the agent run that just ended, and its
# transcript, to the fabrik-runs store (src/kit/runStore.ts): gets a token that
# reads the Product's Kit config and a second one scoped to fabrik-runs with
# Contents write only from the store-token action, which loads the Fabrik App
# key through the push service account, and runs src/kit/record-main.ts, which
# builds the record (src/kit/runRecord.ts) and writes it
# (src/kit/recordWriter.ts).
#
# When fabrik-runs doesn't exist or the Fabrik App isn't installed on it, the
# store-token action finds no store, the store's token isn't minted, and no
# step fails: the program writes one step-summary line naming the setup step,
# and the action ends successfully. A non-private store
# gets nothing written. The push job runs it after Run the Loop, with
# `if: always()` and `continue-on-error: true`, so it never fails the job:
#   - uses: ./kit/.github/actions/write-run-record
# The job's env carries FABRIK_NEEDS, and the agent job's artifacts are in
# $RUNNER_TEMP/agent, as for Run the Loop.
#
# For a record it wrote, or found already in the store, the program then runs
# the scoring plan (#149). A skip's score file it writes itself, with the same
# store token; a score it passes out as `score` and `record`, which the push
# job passes on to the judge job and the score-record job. With no store, or
# one that isn't private, nothing is scored.
name: Write the Run record
description: Writes the run's transcript and Run record to the fabrik-runs store.

inputs:
  op-push-token:
    description: The push service account's token (secrets.OP_PUSH_TOKEN), which reads the Fabrik App vault.
    required: true
  role:
    description: The agent role the Kit job routed to (needs.kit.outputs.route), whose transcript the agent job kept.
    required: true
  empty-diff:
    description: '"true" when the Loop found the Implement run branch changed nothing, an empty diff (the run-loop empty-diff output), which the record says.'
    required: false
    default: ""

outputs:
  score:
    description: '"true" when the scoring plan picked the run for the judge job to score.'
    value: ${{ steps.record.outputs.score }}
  record:
    description: The scored run's Run record's path in the store, for the score-record job.
    value: ${{ steps.record.outputs.record }}
  scored-run:
    description: The scored run's kind, from its Run record, as one line of JSON (src/kit/scorer.ts's JudgedRun), for the judge (#450).
    value: ${{ steps.record.outputs.scored-run }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Kept for 7 days by the agent job; red checks and a run with nothing to record leave none.
    - name: Take the agent's transcript
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: fabrik-transcript-${{ inputs.role }}
        path: ${{ runner.temp }}/transcript

    # The store's token, and one that reads the Product's Kit config, the role
    # defaults a record falls back on. The store's is empty for a store the App
    # isn't on yet, and the program names the setup step.
    - name: Mint the Fabrik App's tokens
      id: tokens
      uses: ./kit/.github/actions/store-token
      with:
        op-push-token: ${{ inputs.op-push-token }}
        kit-config-token: "true"

    - name: Write the Run record
      id: record
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        FABRIK_PRODUCT_TOKEN: ${{ steps.tokens.outputs.kit-config-token }}
        FABRIK_STORE_TOKEN: ${{ steps.tokens.outputs.store-token }}
        FABRIK_TRANSCRIPT_DIR: ${{ runner.temp }}/transcript
        FABRIK_EMPTY_DIFF: ${{ inputs.empty-diff }}
      run: node src/kit/record-main.ts
