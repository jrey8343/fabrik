const usd = n => '$' + n.toFixed(2);
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const hm = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
const dayTime = d => DAYS[d.getDay()] + ' ' + hm(d);
const shortDay = d => DAYS[d.getDay()].slice(0,3) + ' ' + d.getDate() + ' Nov';
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const span = ms => { const h = Math.round(ms / 36e5); const d = Math.floor(h / 24); return d ? `${plural(d,'day')}${h % 24 ? ' ' + plural(h % 24,'hour') : ''}` : plural(h,'hour'); };
const hours = mins => { const h = Math.floor(mins / 60), m = mins % 60; return h ? `${h} h ${m} min` : `${m} min`; };

function world(){
  const sc = SCENES[S.scenario], quiet = S.scenario === 'quiet';
  const work = WORK.filter(w => !(quiet && w.busy)).map(w => ({...w, runs: w.runs
    .filter(r => !(quiet && /stepped up/.test(r[1])))
    .map(([role, note, model, sub, cost, day, time]) => ({role, note, model, sub: quiet ? 's1' : sub, usd: cost, at: T(day, time), mins: Math.round(4 + cost * 7)}))}));
  return {...sc, work};
}
const within = (from, to) => r => r.at >= from && r.at < to;
const sum = rs => rs.reduce((t, r) => t + r.usd, 0);
const total = w => sum(w.runs);
/* Each piece of work with the part of it that falls in a period, dearest first. */
function slice(work, from, to){
  return work.map(w => ({w, runs: w.runs.filter(within(from, to))})).filter(x => x.runs.length).map(x => ({...x, usd: sum(x.runs)})).sort((x, y) => y.usd - x.usd);
}
const mergedIn = (work, from, to) => work.filter(w => w.st === 'merged' && w.merged >= from && w.merged < to);
const avg = ws => ws.length ? ws.reduce((t, w) => t + total(w), 0) / ws.length : null;
const subName = (w, id) => w.subs.find(s => s.id === id).name;
const allUsedUp = w => w.subs.every(s => s.state === 'limit' || s.state === 'credits');

function statePill(w){
  if (w.st === 'merged') return `<span class="pill">Merged</span>`;
  if (w.st === 'never') return `<span class="pill">Never merged</span>`;
  if (w.st === 'other') return `<span class="pill">${w.what}</span>`;
  if (w.where === 'stuck') return `<span class="pill stuck"><i></i>Stuck</span>`;
  if (w.where === 'gate') return `<span class="pill yours"><i></i>Yours to merge</span>`;
  return `<span class="pill run"><i></i>${w.where === 'checks' ? 'Waiting on checks' : 'Running'}</span>`;
}
function factoryPill(w){
  if (allUsedUp(w)) return `<span class="pill held"><i></i>Held</span>`;
  return `<span class="pill run"><i></i>Running on ${w.subs.find(s => s.state === 'running').name}</span>`;
}
const back = (label, act) => `<button class="back" data-act="${act}">‹ ${label}</button>`;
const facts = fs => `<div class="r-facts">${fs.filter(Boolean).map(f => `<span>${f}</span>`).join('')}</div>`;
const heldNote = w => allUsedUp(w) ? `<p class="callout"><b>Nothing is running.</b> Every Subscription is used up and ${plural(w.held,'run')} ${w.held === 1 ? 'is' : 'are'} held. They resume by themselves ${dayTime(w.subs[0].resets)}, or sooner if you close the usage-credits issue under Yours.</p>` : '';
const PRICE_NOTE = `<p class="fine">Dollar figures are what the same runs would have cost at API list prices. Nothing here is billed.</p>`;
const subState = s => s.state === 'limit' ? `used up until ${dayTime(s.resets)}` : s.state === 'credits' ? 'used up, spent usage credits; closing its issue under Yours frees it' : s.state === 'running' ? 'runs go here' : 'next in line';

/* One piece of work as a row: its state and pull request, what it cost in the period, its title, one line more. */
function workRow(w, x, o = {}){
  const body = `<span class="row-top">${statePill(x.w)}<span class="ref">${x.w.pr || x.w.ref}</span><span class="amt">${usd(x.usd)}</span></span>
    <span class="row-title">${esc(x.w.title)}</span>${o.say ? `<span class="row-say">${o.say}</span>` : ''}`;
  return `<div class="row">${o.act ? `<button class="hit" data-act="${o.act}" data-id="${x.w.id}" ${o.open == null ? '' : `aria-expanded="${o.open}"`}>${body}</button>` : `<div class="hit">${body}</div>`}${o.open ? runsTable(w, x.runs, total(x.w)) : ''}</div>`;
}
function runsTable(w, runs, all){
  const rest = all - sum(runs);
  return `<div class="md"><div class="scroll"><table><tr><th>Run</th><th>Model</th><th>Ended</th><th>Cost</th></tr>
    ${runs.map(r => `<tr><td>${r.role}${r.note ? `<small>${esc(r.note)}</small>` : ''}</td><td>${r.model}<small>${subName(w, r.sub)}</small></td><td>${shortDay(r.at).slice(0,3)} ${hm(r.at)}</td><td>${usd(r.usd)}</td></tr>`).join('')}</table></div>
    ${rest > 0.004 ? `<p class="fine">Plus ${usd(rest)} outside this period. ${usd(all)} all told.</p>` : ''}
    <button class="quiet" data-act="gh">Open on GitHub</button></div>`;
}
/* Amounts as a list of plain bars. */
function dist(items, act){
  const max = Math.max(...items.map(x => x.usd), 1);
  return items.map(x => `<div class="row"><${act ? `button data-act="${act}" data-repo="${x.key || ''}" data-what="${esc(x.name)}"` : 'div'} class="hit">
    <span class="row-top">${x.mono ? `<b>${esc(x.name)}</b>` : `<span style="font-size:14px;font-weight:500">${esc(x.name)}</span>`}<span class="amt">${usd(x.usd)}</span></span>
    <span class="meter" style="display:block"><span class="plain" style="width:${Math.round(x.usd / max * 100)}%"></span></span>${x.note ? `<span class="row-say">${x.note}</span>` : ''}</${act ? 'button' : 'div'}></div>`).join('');
}
function subsCompact(w){
  return w.subs.map(s => `<div class="sub"><div class="sub-name"><span>${s.name}</span><span>${s.used}%</span></div>
    <div class="meter"><span class="${s.state === 'limit' || s.state === 'credits' ? 'full' : ''}" style="width:${s.used}%"></span></div><p class="fine" style="margin-top:6px">${subState(s)[0].toUpperCase() + subState(s).slice(1)}.</p></div>`).join('');
}

/* ---------- A: Runway. Leads with how long the Subscriptions last; the dollars are a drill-down by Product repo. ---------- */
/* When a Subscription in use reaches its limit if it keeps the pace it has had since its reset, to the nearest half hour. */
function runsOut(s){ const t = s.start.getTime() + (NOW - s.start) / (s.used / 100); return new Date(Math.round(t / 18e5) * 18e5); }
/* The one sentence A leads with: how long the factory can keep running. */
function runway(w){
  if (allUsedUp(w)) return `Nothing is running until ${w.subs[0].name} resets ${dayTime(w.subs[0].resets)}`;
  const live = w.subs.filter(s => s.state === 'running' || s.state === 'next'), last = live.map(s => ({s, out: runsOut(s)})).filter(x => x.out < x.s.resets);
  if (last.length < live.length) return 'At this pace the factory runs all week without being held';
  const out = new Date(Math.max(...last.map(x => +x.out))), back = w.subs.filter(s => s.state === 'limit' && s.resets > out).sort((x, y) => x.resets - y.resets)[0];
  const next = back || last.map(x => x.s).sort((x, y) => x.resets - y.resets)[0];
  return `At this pace runs keep going until about ${dayTime(out)}, then are held ${span(next.resets - out)} until ${next.name} resets`;
}
function subFull(w, s){
  const elapsed = Math.min(1, (NOW - s.start) / (s.resets - s.start)), tick = Math.round(elapsed * 100), usedUp = s.state === 'limit' || s.state === 'credits';
  const mine = sum(w.work.flatMap(x => x.runs).filter(r => r.sub === s.id && r.at >= s.start));
  let say;
  if (s.state === 'limit') say = `Used up. It reached its weekly limit ${s.reached} and resets ${dayTime(s.resets)}.`;
  else if (s.state === 'credits') say = `Used up. It spent usage credits, and stays unusable until you close its issue. That move is under Yours on Home.`;
  else { const out = runsOut(s); say = (s.state === 'running' ? 'Runs go here. ' : 'Next in line. ') + (out < s.resets ? `At this pace it is used up about ${dayTime(out)}, ${span(s.resets - out)} before it resets.` : `At this pace it lasts until it resets ${dayTime(s.resets)}.`); }
  return `<div class="sub"><div class="sub-name"><span>${s.name}</span><span>${s.used}% of its weekly limit</span></div>
    <div class="meter" role="img" aria-label="${s.used}% used, ${tick}% of its week gone"><span class="${usedUp ? 'full' : ''}" style="width:${s.used}%"></span><span class="tick" style="left:calc(${tick}% - 1px)"></span></div>
    <p class="fine">${say}</p>
    <p class="fine" style="margin-top:2px">The mark is now: ${span(s.resets - NOW)} to its reset. ${usd(mine)} of factory runs since it reset${s.read ? `, read ${s.read}` : ''}.</p></div>`;
}
function renderA(w){
  const week = slice(w.work, WEEK_AGO, NOW);
  if (S.a.work){
    const x = w.work.find(v => v.id === S.a.work), runs = x.runs.filter(within(WEEK_AGO, NOW));
    return `${back(REPO[x.repo], 'a-back')}
      <div class="r-meta">${statePill(x)}<span class="ref">${x.pr || x.ref}</span>${x.pr ? `<span class="ref">Ticket ${x.ref}</span>` : ''}</div>
      <h1 class="r-title">${esc(x.title)}</h1>
      ${facts([`${usd(sum(runs))} in the last 7 days`, plural(runs.length, 'run'), x.st === 'merged' ? 'merged ' + shortDay(x.merged) : ''])}
      <section class="panel"><div class="panel-h">Runs <span>${usd(sum(runs))}</span></div><div style="padding-top:14px">${runsTable(w, runs, total(x))}</div></section>`;
  }
  if (S.a.repo){
    const mine = week.filter(x => x.w.repo === S.a.repo);
    const groups = [['merged','Merged'],['open','Open'],['never','Never merged'],['other','Not a Ticket']].map(([k, label]) => {
      const rows = mine.filter(x => x.w.st === k); if (!rows.length) return '';
      return `<section class="panel"><div class="panel-h">${label} <span>${usd(sum(rows))}</span></div>${rows.map(x => workRow(w, x, {act:'a-work', say: plural(x.runs.length, 'run') + (k === 'merged' ? ', merged ' + shortDay(x.w.merged) : '')})).join('')}</section>`;
    }).join('');
    return `${back('Spend', 'a-back')}<div class="r-meta"><span class="ref">${REPO[S.a.repo]}</span></div>
      <h1 class="r-title">${usd(sum(mine))} in the last 7 days</h1>${facts([plural(mine.length, 'piece') + ' of work'])}${groups}${PRICE_NOTE}`;
  }
  const byRepo = Object.keys(REPO).map(k => ({key: k, name: REPO[k], mono: true, usd: sum(week.filter(x => x.w.repo === k)), note: plural(week.filter(x => x.w.repo === k).length, 'piece') + ' of work'})).sort((x, y) => y.usd - x.usd);
  const merged = mergedIn(w.work, WEEK_AGO, NOW);
  return `${back('Home', 'home')}<div class="r-meta">${factoryPill(w)}<span class="ref">Spend</span></div>
    <h1 class="r-title">${runway(w)}</h1>
    ${facts([`${usd(sum(week))} in the last 7 days`, merged.length ? `${merged.length} merged, ${usd(avg(merged))} each` : 'none merged', w.held ? plural(w.held, 'run') + ' held' : ''])}
    <section class="panel"><div class="panel-h">Subscriptions <span>used in order</span></div><div class="md">${w.subs.map(s => subFull(w, s)).join('')}
      <p class="fine">A share counts everything on the account, not only the factory.</p></div></section>
    <section class="panel"><div class="panel-h">Last 7 days <span>${usd(sum(week))} at API prices</span></div>${dist(byRepo, 'a-repo')}</section>
    ${PRICE_NOTE}`;
}

/* ---------- B: Ledger. One flat list of work for a calendar week, dearest first, with filters. ---------- */
function renderB(w, chosen){
  const from = S.b.week === 0 ? MONDAY : LAST_MONDAY, to = S.b.week === 0 ? NOW : MONDAY;
  const all = slice(w.work, from, to), before = S.b.week === 0 ? sum(slice(w.work, LAST_MONDAY, MONDAY)) : OLDER[5].usd;
  const inRepo = all.filter(x => S.b.repo === 'all' || x.w.repo === S.b.repo);
  const kinds = [['all','Everything'],['merged','Merged'],['open','Open'],['never','Never merged'],['other','Not a Ticket']];
  const shown = inRepo.filter(x => S.b.kind === 'all' || x.w.st === S.b.kind);
  const merged = mergedIn(w.work, from, to), a = avg(merged);
  const mins = w.work.flatMap(x => x.runs).filter(within(from, to)).reduce((t, r) => t + r.mins, 0);
  return `${back('Home', 'home')}<div class="r-meta">${factoryPill(w)}<span class="ref">Spend</span></div>
    <div class="stepper"><button class="step" data-act="b-week" data-d="-1" aria-label="The week before" ${S.b.week === -1 ? 'disabled' : ''}>‹</button><span class="ref">${S.b.week === 0 ? 'Week of 9 November, so far' : 'Week of 2 November'}</span><button class="step" data-act="b-week" data-d="1" aria-label="The week after" ${S.b.week === 0 ? 'disabled' : ''}>›</button></div>
    <h1 class="r-title">${chosen && S.b.week === 0 ? runway(w) : usd(sum(all)) + ' at API prices'}</h1>
    ${facts([chosen && S.b.week === 0 ? `${usd(sum(all))} this week at API prices` : '', chosen && S.b.week === 0 && w.held ? plural(w.held, 'run') + ' held' : '', `${usd(before)} the week before`, merged.length ? `${merged.length} merged, ${usd(a)} each` : 'none merged', `about ${hours(mins)} of Actions runner time`])}
    ${S.b.week === 0 ? (chosen ? '' : heldNote(w)) + `<section class="panel"><div class="panel-h">Subscriptions <span>also on Home</span></div><div class="md">${subsCompact(w)}</div></section>` : ''}
    <div class="toggles" style="margin-top:16px">${[['all','All repos'], ...Object.entries(REPO)].map(([k, label]) => `<button class="toggle" data-act="b-repo" data-repo="${k}" aria-pressed="${S.b.repo === k}">${label} ${usd(sum(all.filter(x => k === 'all' || x.w.repo === k)))}</button>`).join('')}</div>
    <div class="toggles">${kinds.map(([k, label]) => `<button class="toggle" data-act="b-kind" data-kind="${k}" aria-pressed="${S.b.kind === k}">${label} ${usd(sum(inRepo.filter(x => k === 'all' || x.w.st === k)))}</button>`).join('')}</div>
    <section class="panel"><div class="panel-h">${plural(shown.length, 'piece')} of work, dearest first <span>${usd(sum(shown))}</span></div>
      ${shown.length ? shown.map(x => workRow(w, x, {act:'b-open', open: S.b.open === x.w.id, say: `${x.w.pr ? 'Ticket ' + x.w.ref + ' in ' : ''}<code>${REPO[x.w.repo]}</code>, ${plural(x.runs.length, 'run')}${x.w.st === 'merged' ? ', merged ' + shortDay(x.w.merged) : ''}`})).join('') : `<div class="md"><p>Nothing in this week matches.</p></div>`}</section>
    ${PRICE_NOTE}<p class="fine">Runner time is estimated from each run’s start and end.</p>`;
}

/* ---------- C: Trend. Leads with eight weeks; the chosen week's averages and breakdowns sit under the chart. ---------- */
function weekFacts(w, i){
  if (i < 6){ const o = OLDER[i]; return {...o, label:'Week of ' + o.start, canned:true}; }
  const from = i === 6 ? LAST_MONDAY : MONDAY, to = i === 6 ? MONDAY : NOW, sl = slice(w.work, from, to), merged = mergedIn(w.work, from, to);
  const runs = sl.flatMap(x => x.runs.map(r => ({...r, w:x.w})));
  return {start: i === 6 ? '2 Nov' : '9 Nov', label: i === 6 ? 'Week of 2 November' : 'Week of 9 November, so far', part: i === 7, usd: sum(sl), sl, runs,
    mergedN: merged.length, perPr: avg(merged), never: sum(sl.filter(x => x.w.st === 'never')), replay: sum(runs.filter(r => r.role === 'Replay')),
    design: sum(runs.filter(r => r.role === 'Triage' || r.role === 'Design')), mins: runs.reduce((t, r) => t + r.mins, 0)};
}
function renderC(w){
  const weeks = [0,1,2,3,4,5,6,7].map(i => weekFacts(w, i)), f = weeks[S.c.week], prev = S.c.week ? weeks[S.c.week - 1] : null;
  const max = Math.max(...weeks.map(x => x.usd)), maxM = Math.max(...weeks.map(x => x.mins));
  const was = v => prev == null || v == null ? '' : usd(v);
  const chart = `<div class="chart" role="group" aria-label="Dollars at API prices, by week">${weeks.map((x, i) => `<button class="col ${x.part ? 'part' : ''}" data-act="c-week" data-i="${i}" aria-pressed="${S.c.week === i}" title="${x.label}: ${usd(x.usd)}" aria-label="${x.label}: ${usd(x.usd)}"><i style="height:${Math.round(x.usd / max * 100)}%"></i></button>`).join('')}</div>
    <div class="axis">${weeks.map((x, i) => `<span class="${S.c.week === i ? 'on' : ''}">${x.start.replace(' ', '&nbsp;')}</span>`).join('')}</div>`;
  const figs = `<div class="md"><table><tr><th></th><th>Week before</th><th>${f.start}</th></tr>
    <tr><td>Each merged pull request<small>${plural(f.mergedN, 'pull request')} merged</small></td><td>${was(prev && prev.perPr)}</td><td>${f.perPr == null ? 'None' : usd(f.perPr)}</td></tr>
    <tr><td>Never merged</td><td>${was(prev && prev.never)}</td><td>${usd(f.never)}</td></tr>
    <tr><td>Triage and Design sessions</td><td>${was(prev && prev.design)}</td><td>${usd(f.design)}</td></tr>
    <tr><td>Replays</td><td>${was(prev && prev.replay)}</td><td>${usd(f.replay)}</td></tr></table></div>`;
  let detail = `<p class="fine">The prototype’s ledger covers the last two weeks. An older week shows its totals only.</p>`;
  if (!f.canned){
    const byRepo = Object.keys(REPO).map(k => ({name: REPO[k], mono: true, usd: sum(f.sl.filter(x => x.w.repo === k)), note: plural(f.sl.filter(x => x.w.repo === k).length, 'piece') + ' of work'})).sort((x, y) => y.usd - x.usd);
    const roles = ['Implement','Review','Design','Triage','Replay','Retro','Audit','Research'].map(r => ({name: r, usd: sum(f.runs.filter(x => x.role === r)), note: plural(f.runs.filter(x => x.role === r).length, 'run')})).filter(x => x.usd > 0).sort((x, y) => y.usd - x.usd);
    const up = f.runs.filter(r => /stepped up/.test(r.note));
    const models = [{name:'Sonnet', usd: sum(f.runs.filter(r => r.model === 'Sonnet'))}, {name:'Opus', usd: sum(f.runs.filter(r => r.model === 'Opus' && !/stepped up/.test(r.note)))}, {name:'Opus, stepped up', usd: sum(up), note: plural(up.length, 'Step-up')}].filter(x => x.usd > 0);
    detail = `<section class="panel"><div class="panel-h">By Product repo</div>${dist(byRepo, 'stub')}</section>
      <section class="panel"><div class="panel-h">By role</div>${dist(roles)}</section>
      <section class="panel"><div class="panel-h">By model</div>${dist(models)}</section>
      <section class="panel"><div class="panel-h">Dearest <button class="linkish" data-act="stub" data-what="All ${f.sl.length} pieces of work">All ${f.sl.length}</button></div>${f.sl.slice(0, 3).map(x => workRow(w, x, {say: plural(x.runs.length, 'run')})).join('')}</section>`;
  }
  return `${back('Home', 'home')}<div class="r-meta">${factoryPill(w)}<span class="ref">Spend</span></div>
    <h1 class="r-title">Eight weeks at API prices</h1>
    ${facts([`${f.label}: ${usd(f.usd)}`, prev ? `${usd(prev.usd)} the week before` : ''])}
    ${heldNote(w)}
    <section class="panel"><div class="panel-h">${f.label} <span>${usd(f.usd)}</span></div><div class="md">${chart}</div>${figs}</section>
    ${detail}
    <section class="panel"><div class="panel-h">GitHub Actions runner time <span>${hours(f.mins)}</span></div><div class="md">
      <div class="chart small" role="img" aria-label="Runner minutes by week">${weeks.map((x, i) => `<span class="col ${x.part ? 'part' : ''}" aria-pressed="${S.c.week === i}" title="${x.label}: ${hours(x.mins)}"><i style="height:${Math.round(x.mins / maxM * 100)}%"></i></span>`).join('')}</div>
      <p class="fine">Estimated from each run’s start and end. About 1,180 of 3,000 included minutes used this month.</p></div></section>
    <section class="panel"><div class="panel-h">Subscriptions <span>also on Home</span></div><div class="md">${subsCompact(w)}</div></section>
    ${PRICE_NOTE}`;
}

  d:['Say when runs will be held, and for how long.','Find what PR #209 cost this week, then all told.','Find what northside-physio spent last week on work that never merged.','Switch the scene to Held, then Quiet.'],
  a:['Say when Subscription 2 runs out, and whether Subscription 1 is back by then.','Find what PR #209 cost, and why.','Switch the scene to Held, then Quiet.'],
  b:['Find what PR #209 cost this week, then all told.','Find what northside-physio spent last week on work that never merged.','Switch the scene to Held, then Quiet.'],
  c:['Say whether a merged pull request is getting dearer.','Find what Step-ups cost last week.','Find what PR #209 cost. (Can you?)'],
};
function notes(w){
  const v = VARIANTS.find(x => x[0] === S.variant);
  return `<h2>${v[0].toUpperCase()}: ${v[1]}</h2>
    <h3>What this variant holds</h3><ul>${BETS[S.variant].map(b => `<li>${b}</li>`).join('')}</ul>
    <h3>Try</h3><ul>${TRY[S.variant].map(b => `<li>${b}</li>`).join('')}</ul>
    <h3>The scene</h3><p class="state">${w.say}</p>
    <p class="state">Now is Tuesday 10 November, 14:15. ${w.subs.map(s => `${s.name} ${s.used}%`).join(', ')}. ${w.held} held.</p>
    <div class="btns"><button class="btn quiet p-notes-close" data-act="notes">Close notes</button></div>
    <p class="fine">Prototype. Every repo, issue and figure is invented. Nothing here talks to GitHub.</p>`;
}
function bar(){
  const v = VARIANTS.find(x => x[0] === S.variant), s = SCENARIOS.find(x => x[0] === S.scenario);
  return `<div class="proto" role="toolbar" aria-label="Prototype switcher">
    <button data-act="prev" aria-label="Previous variant">&lsaquo;</button><span class="p-label"><b>${v[0].toUpperCase()}</b>${v[1]}</span><button data-act="next" aria-label="Next variant">&rsaquo;</button>
    <span class="p-sep"></span><button data-act="scenario" aria-label="Change the scene">${s[1]}</button>
    <span class="p-sep p-notes"></span><button class="p-notes" data-act="notes">Notes</button></div>`;
}

const app = document.getElementById('app');
function render(){
  const w = world();
  const body = {d: w => renderB(w, true), a:renderA, b:renderB, c:renderC}[S.variant](w);
  app.innerHTML = `<div class="stage"><div class="phone">${body}</div><aside class="notes" ${S.notes ? 'data-open' : ''}>${notes(w)}</aside></div>${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}${bar()}`;
  const name = S.variant + (S.scenario === 'busy' ? '' : '-' + S.scenario);
  if (location.hash !== '#' + name){ try { history.replaceState(null, '', '#' + name); } catch (e) {} }
}
let toastTimer;
function toast(t){ S.toast = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; const el = app.querySelector('.toast'); if (el) el.remove(); }, 3800); }
function cycle(list, cur, d){ const i = list.findIndex(x => x[0] === cur); return list[(i + d + list.length) % list.length][0]; }
function reset(){ S.a = {repo:null, work:null}; S.b.open = null; }

const ACT = {
  prev(){ S.variant = cycle(VARIANTS, S.variant, -1); reset(); window.scrollTo(0,0); },
  next(){ S.variant = cycle(VARIANTS, S.variant, 1); reset(); window.scrollTo(0,0); },
  scenario(){ S.scenario = cycle(SCENARIOS, S.scenario, 1); reset(); },
  notes(){ S.notes = !S.notes; },
  home(){ toast('This would go back to Home.'); },
  gh(){ toast('This would open GitHub.'); },
  stub(d){ toast(d.what + ' would open here.'); },
  'a-repo'(d){ S.a.repo = d.repo; window.scrollTo(0,0); },
  'a-work'(d){ S.a.work = d.id; window.scrollTo(0,0); },
  'a-back'(){ if (S.a.work) S.a.work = null; else S.a.repo = null; window.scrollTo(0,0); },
  'b-week'(d){ S.b.week = Math.max(-1, Math.min(0, S.b.week + +d.d)); S.b.open = null; },
  'b-repo'(d){ S.b.repo = d.repo; S.b.open = null; },
  'b-kind'(d){ S.b.kind = d.kind; S.b.open = null; },
  'b-open'(d){ S.b.open = S.b.open === d.id ? null : d.id; },
  'c-week'(d){ S.c.week = +d.i; },
};
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  fn(el.dataset); render();
});
document.addEventListener('keydown', e => {
  const t = e.target; if (t && t.matches && t.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft'){ ACT.prev(); render(); } else if (e.key === 'ArrowRight'){ ACT.next(); render(); }
});
function fromHash(){
  const h = (location.hash || '').replace('#','').split('-');
  if (VARIANTS.some(x => x[0] === h[0])) S.variant = h[0];
  S.scenario = SCENARIOS.some(x => x[0] === h[1]) ? h[1] : 'busy';
}
try { const q = new URLSearchParams(location.search).get('variant'); if (q && VARIANTS.some(x => x[0] === q.toLowerCase())) S.variant = q.toLowerCase(); } catch (e) {}
if (location.hash) fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); });
render();
})();
</script>
