# The Product repo's caller workflow, saved as .github/workflows/fabrik.yml.
#
# Every `uses:` line pins the same exact Fabrik release; this file is the only
# place the Kit's version appears (ADR-0003). Disable this workflow to pause
# the factory in this repo; set max_in_flight to 0 in .fabrik/config.json to
# pause only Dispatch.
name: Fabrik

# What each run shows as on the Actions tab (#477): the run the Kit starts on
# its event, and on which issue or PR, such as "Implement #12" or "Review PR
# #60", or the event itself, such as "#87 labeled bug", when that isn't known
# from the event alone. GitHub names a run from this file only, never from the
# Kit workflow it calls, and only from the event, before any job runs; the
# jobs' own names say the rest, such as an Implement run's Retry number. The
# first case that fits names the run, so the most specific comes first.
run-name: >-
  ${{
  github.event_name == 'schedule' && 'Tick' ||
  github.event_name == 'push' && format('Push to {0}', github.ref_name) ||
  github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'fabrik:audit') && format('Audit #{0}', github.event.issue.number) ||
  github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'fabrik:retro') && format('Retro #{0}', github.event.issue.number) ||
  github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.labels.*.name, 'fabrik:token-rotation') || contains(github.event.issue.labels.*.name, 'fabrik:weekly-limit') || contains(github.event.issue.labels.*.name, 'fabrik:usage-credits') || contains(github.event.issue.labels.*.name, 'fabrik:replay')) && format('Opened #{0}', github.event.issue.number) ||
  github.event_name == 'issues' && github.event.action == 'opened' && format('Triage #{0}', github.event.issue.number) ||
  github.event_name == 'issues' && github.event.label.name == 'agent:implement' && format('Implement #{0}', github.event.issue.number) ||
  github.event_name == 'issues' && github.event.label.name == 'agent:design' && format('Design-session turn #{0}', github.event.issue.number) ||
  github.event_name == 'issues' && github.event.label.name == 'agent:research' && format('Research #{0}', github.event.issue.number) ||
  github.event_name == 'issues' && github.event.label.name == 'agent:replay' && format('Replay #{0}', github.event.issue.number) ||
  github.event_name == 'issues' && github.event.action == 'labeled' && format('#{0} labeled {1}', github.event.issue.number, github.event.label.name) ||
  github.event_name == 'issues' && format('#{0} {1}', github.event.issue.number, github.event.action) ||
  github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'needs-design') && format('Design-session turn #{0}', github.event.issue.number) ||
  github.event_name == 'issue_comment' && format('Comment on #{0}', github.event.issue.number) ||
  github.event_name == 'pull_request_target' && github.event.label.name == 'agent:review' && format('Review PR #{0}', github.event.pull_request.number) ||
  github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) && startsWith(github.event.pull_request.head.ref, 'fabrik/') && format('Review PR #{0}', github.event.pull_request.number) ||
  github.event_name == 'pull_request_target' && github.event.action == 'labeled' && format('PR #{0} labeled {1}', github.event.pull_request.number, github.event.label.name) ||
  github.event_name == 'pull_request_target' && format('PR #{0} {1}', github.event.pull_request.number, github.event.action) ||
  github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && format('Request changes PR #{0}', github.event.pull_request.number) ||
  github.event_name == 'pull_request_review' && format('Comment on PR #{0}', github.event.pull_request.number) ||
  format('{0} {1}', github.event_name, github.event.action)
  }}

on:
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  # _target, so these runs use main's workflow and Kit config, never the PR's.
  # Only the read-only Reviewer checks out a PR's head, to read it; nothing runs its code.
  # opened, synchronize and reopened start a Review once the required checks
  # finish, and labeled lets agent:review resume one after a failure.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review, closed]
  # The Operator's Request changes at the Merge gate. GitHub has no _target
  # form of it, so it runs the PR's copy of this file and Kit config, which an
  # agent PR can't change: the Kit refuses agent branches that touch them.
  pull_request_review:
    types: [submitted]
  # A push to the default branch, whatever it touches: an agent PR waiting at
  # the Merge gate may now conflict with main, which the Kit then resolves
  # (ADR-0011). A change to the Kit config among them also runs a Dispatch
  # check, so raising max_in_flight (from 0, to resume Dispatch) takes effect
  # straight away. GitHub takes one push filter, so there's no path filter;
  # a branch filter keeps tag pushes out, branches-ignore keeps the Kit's own
  # branches from starting runs, and the loop job's if skips any other branch.
  push:
    branches-ignore: ["fabrik/**", "prototype/**", "research/**"]
  # The Loop's time-based rules, such as closing the weekly-limit issue after its reset.
  schedule:
    - cron: "17 * * * *"

permissions: {}

jobs:
  loop:
    # Only a push to the default branch moves main, whose Kit config is the Product's, so a push elsewhere runs nothing.
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: jrey8343/fabrik/.github/workflows/loop.yml@v0.1.0-pre.1
    # The most any Kit job may hold; each job narrows it. None of these writes:
    # every write goes through the Fabrik App token in a push job.
    permissions:
      id-token: write
      contents: read
      issues: read
      pull-requests: read
      # For a Review to read the agent PR's required checks.
      checks: read
      statuses: read
      actions: read
    secrets:
      OP_AGENT_TOKEN: ${{ secrets.FABRIK_OP_AGENT_TOKEN }}
      OP_IMPLEMENT_TOKEN: ${{ secrets.FABRIK_OP_IMPLEMENT_TOKEN }}
      OP_PUSH_TOKEN: ${{ secrets.FABRIK_OP_PUSH_TOKEN }}

  tick:
    if: github.event_name == 'schedule'
    uses: jrey8343/fabrik/.github/workflows/schedule.yml@v0.1.0-pre.1
    # To read the Kit's pinned commit, for the conflict check to read whether an Implement job is under way,
    # and for the hourly Dispatch check to count Implement and Research runs in flight.
    # None of these writes: every write goes through the Fabrik App token.
    permissions:
      id-token: write
      actions: read
    secrets:
      OP_PUSH_TOKEN: ${{ secrets.FABRIK_OP_PUSH_TOKEN }}
