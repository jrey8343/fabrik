# The Product repo's caller workflow, saved as .github/workflows/fabrik.yml.
#
# Every `uses:` line pins the same exact Fabrik release; this file is the only
# place the Kit's version appears (ADR-0003). Disable this workflow to pause
# the factory in this repo.
name: Fabrik

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  loop:
    uses: jrey8343/fabrik/.github/workflows/loop.yml@v0.1.0-pre.1
    permissions:
      id-token: write
    secrets:
      OP_PUSH_TOKEN: ${{ secrets.FABRIK_OP_PUSH_TOKEN }}
