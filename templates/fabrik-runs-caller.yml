# The fabrik-runs store's caller workflow, saved as
# .github/workflows/weekly-summary.yml in jrey8343/fabrik-runs (ADR-0009).
#
# It files the Weekly summary each Monday morning in the Operator's time zone,
# which setup writes below, and whenever the Operator runs it by hand. Every
# morning at the same time it runs the Tick check, which opens a Dead-tick
# issue in each Product repo whose hourly Tick has stopped (#461): a Tick
# can't be watched from the repo where it died. Like a Product repo's caller,
# its `uses:` lines pin one exact Fabrik release (ADR-0003), and Dependabot
# bumps them.
name: Fabrik weekly summary

on:
  schedule:
    - cron: "0 7 * * 1"
      timezone: "UTC"
    - cron: "0 7 * * *"
      timezone: "UTC"
  workflow_dispatch:

permissions: {}

jobs:
  summary:
    # On Mondays both schedules fire, each its own run: this job takes the Monday one.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * 1'
    uses: jrey8343/fabrik/.github/workflows/weekly-summary.yml@v0.1.0-pre.1
    # Only to read the Kit's pinned commit; every read and write goes through
    # the Fabrik App's scoped tokens.
    permissions:
      id-token: write
    secrets:
      OP_PUSH_TOKEN: ${{ secrets.FABRIK_OP_PUSH_TOKEN }}

  tick-check:
    if: github.event.schedule == '0 7 * * *'
    uses: jrey8343/fabrik/.github/workflows/tick-check.yml@v0.1.0-pre.1
    # Only to read the Kit's pinned commit; every read and write goes through
    # the Fabrik App's token.
    permissions:
      id-token: write
    secrets:
      OP_PUSH_TOKEN: ${{ secrets.FABRIK_OP_PUSH_TOKEN }}
